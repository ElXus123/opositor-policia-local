<script>
/* ====== TEMARIO OFICIAL (Anexo II, Orden HAP/678/2026, BOA nº 89 de 13/05/2026) ====== */
const O=id=>OLD.find(t=>t.id===id);
const TEMAS=[
{id:1,b:"Parte general",t:"La Constitución española de 1978. Características generales y principios inspiradores. Estructura. Derechos y deberes fundamentales",n:"CE 1978",r:O(1).r,c:O(1).c},
{id:2,b:"Parte general",t:"La organización del Estado. La Corona. Las Cortes Generales. El poder judicial. La Administración del Estado. El Presidente del Gobierno y los Ministros. Título VIII",n:"CE · Ley 40/2015 (Título I)",
r:O(2).r.concat(["La Administración General del Estado (Ley 40/2015) se organiza en Ministerios. Son órganos superiores los Ministros y los Secretarios de Estado; son órganos directivos los Subsecretarios y Secretarios generales, los Secretarios generales técnicos y Directores generales, y los Subdirectores generales. En el territorio, la AGE está representada por los Delegados del Gobierno en las CCAA y los Subdelegados del Gobierno en las provincias.","El Presidente del Gobierno dirige la acción del Gobierno y coordina las funciones de sus miembros (art. 98 CE). Es elegido por el Congreso por mayoría absoluta en primera votación o simple en la segunda, 48 horas después (art. 99 CE). El Título VIII regula la organización territorial: municipios, provincias y Comunidades Autónomas (art. 137)."]),
c:O(2).c.concat([["Órganos superiores de la AGE","Ministros y Secretarios de Estado."],["Representante de la AGE en cada provincia","El Subdelegado del Gobierno."],["Investidura del Presidente del Gobierno (art. 99 CE)","Mayoría absoluta en primera votación; simple en la segunda, 48 horas después."]])},
{id:3,b:"Parte general",t:"El Derecho Administrativo. Procedimiento administrativo y régimen jurídico del sector público. Notificación. Términos y plazos. Particularidades del procedimiento local",n:"Ley 39/2015 · Ley 40/2015",
r:O(6).r.concat(["Fases del procedimiento: iniciación (de oficio o a solicitud del interesado), ordenación, instrucción (alegaciones, prueba, informes, audiencia) y finalización (resolución, desistimiento, renuncia, caducidad o terminación convencional).","Práctica de la notificación: preferentemente por medios electrónicos; las personas jurídicas están obligadas a relacionarse electrónicamente. La notificación electrónica se entiende rechazada a los 10 días naturales desde su puesta a disposición sin acceder a su contenido. Si la notificación en papel no puede practicarse, se hace un segundo intento en hora distinta dentro de los tres días siguientes y, si fracasa, se publica en el BOE (Tablón Edictal Único).","En el ámbito local, los actos del Alcalde y de la Junta de Gobierno Local que ponen fin a la vía administrativa pueden recurrirse en reposición; los acuerdos del Pleno ponen fin a la vía administrativa."]),
c:O(6).c.concat([["Notificación electrónica no abierta","Se entiende rechazada a los 10 días naturales."],["Fases del procedimiento","Iniciación, ordenación, instrucción y finalización."]])},
{id:4,b:"Parte general",t:"Estatuto de Autonomía de Aragón. Estructura. Título preliminar. Organización institucional. Competencias",n:"LO 5/2007, de 20 de abril",r:O(3).r,c:O(3).c},
{id:5,b:"Parte general",t:"La Administración Local. Entidades que comprende. La provincia. El municipio: concepto y elementos. Organización y competencias. La comarca",n:"LBRL · Ley 7/1999 Aragón · Ley 10/1993",
r:["Son entidades locales territoriales el municipio, la provincia y la isla (art. 3 LBRL). Gozan también de la condición de entidades locales las comarcas, las áreas metropolitanas y las mancomunidades de municipios.","La provincia es una entidad local con personalidad jurídica propia, formada por la agrupación de municipios. Su gobierno corresponde a la Diputación Provincial, formada por el Presidente, los Vicepresidentes, la Junta de Gobierno y el Pleno. Le corresponde coordinar los servicios municipales, prestar asistencia y cooperación jurídica, económica y técnica a los municipios, sobre todo a los de menor capacidad, y prestar servicios supramunicipales (art. 36 LBRL).","El municipio es la entidad local básica de la organización territorial del Estado. Sus elementos son el territorio (término municipal), la población (vecinos inscritos en el Padrón) y la organización (art. 11). Tiene competencias propias (art. 25), entre ellas policía local, protección civil, tráfico y movilidad, urbanismo y medio ambiente urbano, y competencias delegadas.","La comarca agrupa municipios contiguos con vínculos territoriales, económicos o sociales (Ley 10/1993, de Comarcalización de Aragón). En Aragón hay 33 delimitaciones comarcales y su órgano es el Consejo Comarcal, presidido por el Presidente de la comarca."],
c:[["Entidades locales territoriales (art. 3 LBRL)","Municipio, provincia e isla."],["Órganos de la Diputación Provincial","Presidente, Vicepresidentes, Junta de Gobierno y Pleno."],["Elementos del municipio","Territorio, población y organización."],["Ley de comarcalización de Aragón","Ley 10/1993, de 4 de noviembre."],["Órgano de gobierno de la comarca","Consejo Comarcal."]]},
{id:6,b:"Parte general",t:"La Alcaldía. El Pleno. La Junta de Gobierno Local. Las Comisiones Informativas. La organización municipal",n:"LBRL arts. 19-24 · LOREG art. 196",
r:["El Alcalde es elegido por los concejales: puede ser candidato cualquier concejal que haya encabezado su lista; si nadie obtiene mayoría absoluta, es proclamado el que encabece la lista más votada (art. 196 LOREG). Puede ser destituido por moción de censura o cesar por cuestión de confianza.","Atribuciones del Alcalde (art. 21 LBRL): dirige el gobierno y la administración municipal, representa al Ayuntamiento, convoca y preside el Pleno y la Junta de Gobierno Local, dicta bandos, ejerce la jefatura superior de todo el personal y la de la Policía Municipal, sanciona las infracciones de ordenanzas salvo que se atribuya a otro órgano y adopta medidas urgentes en caso de catástrofe, dando cuenta al Pleno.","Los Tenientes de Alcalde sustituyen al Alcalde por orden de nombramiento en casos de vacante, ausencia o enfermedad.","El Pleno lo integran todos los concejales y lo preside el Alcalde. Celebra sesión ordinaria como mínimo cada mes en municipios de más de 20.000 habitantes, cada dos meses en los de 5.001 a 20.000 y cada tres meses en los de hasta 5.000 (art. 46 LBRL). Aprueba ordenanzas, presupuestos y el planeamiento general, y controla a los órganos de gobierno.","La Junta de Gobierno Local la forman el Alcalde y un número de concejales no superior al tercio del número legal, nombrados y separados libremente por él. Asiste al Alcalde y ejerce las atribuciones que le deleguen. Las Comisiones Informativas estudian, informan o consultan los asuntos que se someten al Pleno; existen en los municipios de más de 5.000 habitantes y en los menores si así lo prevén."],
c:[["Elección del Alcalde si nadie tiene mayoría absoluta","Se proclama al cabeza de la lista más votada."],["Sesión ordinaria del Pleno en municipios de más de 20.000 habitantes","Como mínimo, una al mes."],["Sesión ordinaria del Pleno en municipios de hasta 5.000 habitantes","Como mínimo, cada tres meses."],["Miembros de la Junta de Gobierno Local","Alcalde y concejales en número no superior al tercio del número legal."],["Quién sustituye al Alcalde","Los Tenientes de Alcalde, por orden de nombramiento."]]},
{id:7,b:"Parte general",t:"Derechos y deberes de los vecinos. Información y participación. El ciudadano como usuario de los servicios públicos. Servicios públicos municipales",n:"LBRL arts. 15-18, 25-26 y 69-72",
r:["Son vecinos los inscritos en el Padrón municipal. Toda persona que viva en España debe inscribirse en el Padrón del municipio donde resida habitualmente; si vive en varios, en el que habite más tiempo al año (art. 15).","Derechos y deberes de los vecinos (art. 18): ser elector y elegible; participar en la gestión municipal; utilizar los servicios públicos y acceder a los aprovechamientos comunales; contribuir a las cargas municipales; ser informado y dirigir solicitudes; pedir la consulta popular; exigir la prestación de los servicios obligatorios; ejercer la iniciativa popular.","Participación: las sesiones del Pleno son públicas; los vecinos pueden presentar iniciativas populares (art. 70 bis); el Alcalde puede someter a consulta popular asuntos de competencia municipal de especial relevancia, previo acuerdo por mayoría absoluta del Pleno y autorización del Gobierno de la Nación (art. 71).","Servicios mínimos (art. 26): en todos los municipios alumbrado, cementerio, recogida de residuos, limpieza viaria, agua potable, alcantarillado, acceso a los núcleos y pavimentación; en los de más de 5.000, además parque público, biblioteca y tratamiento de residuos; en los de más de 20.000, protección civil, servicios sociales, prevención y extinción de incendios e instalaciones deportivas; en los de más de 50.000, transporte colectivo urbano y medio ambiente urbano."],
c:[["Quiénes son vecinos","Los inscritos en el Padrón municipal."],["Consulta popular municipal (art. 71 LBRL)","La convoca el Alcalde, con acuerdo del Pleno por mayoría absoluta y autorización del Gobierno de la Nación."],["Servicio mínimo de biblioteca pública","Municipios de más de 5.000 habitantes."],["Servicio mínimo de protección civil","Municipios de más de 20.000 habitantes."]]},
{id:8,b:"Parte general",t:"Los Reglamentos y Ordenanzas Locales. Procedimiento de elaboración y aprobación",n:"LBRL arts. 49, 70 y 139-141",r:O(5).r,c:O(5).c},
{id:9,b:"Parte general",t:"La función pública local. Derechos y deberes. Incompatibilidades. Régimen disciplinario. Procedimiento disciplinario de la Policía Local",n:"TREBEP · Ley 53/1984 · Ley 8/2013",
r:O(7).r.concat(["Incompatibilidades: la Ley 53/1984 establece que el personal al servicio de las Administraciones no puede compatibilizar dos puestos públicos salvo excepciones, y necesita autorización para actividades privadas, que no se concede si perjudican la imparcialidad o el horario.","El régimen disciplinario de los policías locales de Aragón se rige por la Ley 8/2013 y por la legislación orgánica aplicable a las Fuerzas y Cuerpos de Seguridad. Estudia del texto legal la tipificación de faltas muy graves, graves y leves, las sanciones, el procedimiento, la suspensión preventiva y el procedimiento abreviado por faltas leves."]),
c:O(7).c.concat([["Ley de incompatibilidades del personal de las AAPP","Ley 53/1984, de 26 de diciembre."]])},
{id:10,b:"Parte general",t:"Los bienes de las Entidades Locales. Clases y régimen jurídico. Los presupuestos locales: principios, contenido, formación, aprobación y entrada en vigor",n:"RD 1372/1986 · RDL 2/2004 (TRLRHL)",
r:["Los bienes de las entidades locales son de dominio público o patrimoniales. Son de dominio público los de uso público (calles, plazas, caminos, parques) y los de servicio público (casa consistorial, mercados, cementerios). Son patrimoniales los que no están destinados al uso ni al servicio público. Los bienes comunales son de dominio público y su aprovechamiento corresponde al común de los vecinos (Reglamento de Bienes, RD 1372/1986).","Los bienes de dominio público y los comunales son inalienables, imprescriptibles e inembargables. Las entidades locales pueden recuperar de oficio la posesión de sus bienes de dominio público en cualquier momento.","El presupuesto general (RDL 2/2004, Texto Refundido de la Ley Reguladora de las Haciendas Locales) es la expresión cifrada, conjunta y sistemática de las obligaciones que, como máximo, pueden reconocerse y de los derechos que se prevean liquidar durante el ejercicio. Principios: anualidad (coincide con el año natural), unidad, universalidad, equilibrio y especialidad.","Formación y aprobación: lo forma el Presidente de la entidad y lo remite al Pleno antes del 15 de octubre. Aprobado inicialmente, se expone al público durante 15 días hábiles; si no hay reclamaciones, se considera definitivo. Entra en vigor cuando se publica resumido por capítulos en el Boletín Oficial de la Provincia. Debe aprobarse antes del 31 de diciembre; si no, se prorroga el del ejercicio anterior."],
c:[["Clases de bienes de dominio público local","De uso público y de servicio público."],["Características de los bienes de dominio público y comunales","Inalienables, imprescriptibles e inembargables."],["Exposición pública del presupuesto aprobado inicialmente","15 días hábiles."],["Entrada en vigor del presupuesto","Al publicarse resumido por capítulos en el BOP."],["Si el presupuesto no se aprueba antes del 1 de enero","Se prorroga el del ejercicio anterior."]]},
{id:11,b:"Parte general",t:"Prevención de riesgos en la Policía Local. Normativa básica. Derechos y deberes. Prevención del suicidio en policías",n:"Ley 31/1995",
r:["La Ley 31/1995, de 8 de noviembre, de Prevención de Riesgos Laborales, no se aplica a las actividades de policía cuyas particularidades lo impidan, pero inspira la normativa específica que protege la seguridad y salud de los policías.","Derechos del trabajador: protección eficaz, información, consulta y participación, formación, vigilancia periódica de la salud y equipos de protección adecuados. Ante un riesgo grave e inminente puede interrumpir su actividad y abandonar el lugar de trabajo (art. 21).","Deberes (art. 29): usar adecuadamente equipos y medios de protección, no inutilizar dispositivos de seguridad, informar de inmediato de situaciones de riesgo y cooperar con el empresario. La participación se canaliza a través de los Delegados de Prevención y del Comité de Seguridad y Salud (obligatorio a partir de 50 trabajadores).","Riesgos propios: agresiones, tráfico, persecuciones, turnicidad y nocturnidad, estrés y trauma. La prevención del suicidio en policías se basa en detectar señales de alerta (aislamiento, cambios de conducta, desesperanza, comentarios de muerte, consumo de alcohol), en el control del acceso al arma, en el apoyo psicológico y en romper el estigma de pedir ayuda. La línea 024 atiende la conducta suicida las 24 horas."],
c:[["Ley de Prevención de Riesgos Laborales","Ley 31/1995, de 8 de noviembre."],["Derecho ante riesgo grave e inminente (art. 21)","Interrumpir la actividad y abandonar el lugar de trabajo."],["Comité de Seguridad y Salud","Obligatorio a partir de 50 trabajadores."],["Teléfono de atención a la conducta suicida","024."]]},
{id:12,b:"Parte específica",t:"Ley Orgánica de Fuerzas y Cuerpos de Seguridad. Principios básicos de actuación. Disposiciones estatutarias comunes. Las Policías Locales. Juntas Locales de Seguridad",n:"LO 2/1986, de 13 de marzo",r:O(8).r,c:O(8).c},
{id:13,b:"Parte específica",t:"La Policía: concepto, misión y funciones en un estado democrático. La Policía en Aragón. La Ley de Coordinación de las Policías Locales. Normas marco y reglamentos",n:"Ley 8/2013 · Decreto 222/1991 · Decreto 10/2023",
r:O(9).r.concat(["Normas de desarrollo citadas en la convocatoria: el Decreto 222/1991, de 17 de diciembre, que aprueba el Reglamento marco de organización de las Policías Locales de Aragón, y el Decreto 10/2023, de 8 de febrero, que regula la Academia Aragonesa de Policías Locales. El art. 23.4 de la Ley 8/2013 permite a los ayuntamientos encomendar la selección de sus policías a la Comunidad Autónoma, a través del IAAP, que es lo que da lugar al proceso selectivo unificado. La Comisión de Coordinación de las Policías Locales de Aragón es un órgano consultivo, deliberante y de participación adscrito a la Dirección General de Interior y Emergencias. La disposición adicional cuarta de la Ley 8/2013 prevé la reserva de plazas para militares profesionales de tropa y marinería."]).concat(O(18).r),
c:O(9).c.concat([["Reglamento marco de organización de las Policías Locales de Aragón","Decreto 222/1991, de 17 de diciembre."],["Norma de la Academia Aragonesa de Policías Locales","Decreto 10/2023, de 8 de febrero."],["Precepto que permite la selección unificada por el Gobierno de Aragón","Art. 23.4 de la Ley 8/2013."],["Órgano consultivo de coordinación","Comisión de Coordinación de las Policías Locales de Aragón."]]).concat(O(18).c)},
{id:14,b:"Parte específica",t:"Ley Orgánica de Protección de la Seguridad Ciudadana. El derecho de reunión. Seguridad pública y privada",n:"LO 4/2015 · LO 9/1983 · Ley 5/2014",
r:O(13).r.concat(["Derecho de reunión (LO 9/1983): reunión es la concurrencia concertada y temporal de más de 20 personas con finalidad determinada. Las reuniones en lugares de tránsito público y las manifestaciones se comunican por escrito a la autoridad gubernativa (Delegación o Subdelegación del Gobierno) con 10 días naturales de antelación como mínimo y 30 como máximo; por causas extraordinarias y graves, con 24 horas. La autoridad solo puede prohibirlas o modificarlas por razones fundadas de alteración del orden público con peligro para personas o bienes.","Seguridad privada (Ley 5/2014): es complementaria y subordinada a la seguridad pública. El personal de seguridad privada (vigilantes, escoltas, guardas rurales, detectives) tiene el deber de colaborar con las Fuerzas y Cuerpos de Seguridad y seguir sus instrucciones."]),
c:O(13).c.concat([["Concepto legal de reunión (LO 9/1983)","Concurrencia concertada y temporal de más de 20 personas con finalidad determinada."],["Antelación de la comunicación de una manifestación","Entre 10 y 30 días naturales; 24 horas por causas extraordinarias y graves."],["Ley de seguridad privada","Ley 5/2014, de 4 de abril."]])},
{id:15,b:"Parte específica",t:"El Código Penal. Los delitos y su clasificación. Garantías penales y aplicación de la ley penal. Personas criminalmente responsables. Causas que modifican la responsabilidad. Penas",n:"LO 10/1995 · Libro I",r:O(10).r.concat(["Garantías penales: no será castigado ningún delito ni impuesta ninguna pena que no esté prevista por ley anterior a su perpetración (arts. 1 y 2). Las leyes penales no tienen efecto retroactivo, salvo las que favorezcan al reo. Atenuantes (art. 21): eximentes incompletas, adicción grave, arrebato u obcecación, confesión antes de conocer el procedimiento, reparación del daño y dilaciones indebidas."]),c:O(10).c.concat([["¿Retroactividad de la ley penal?","Solo la que favorezca al reo (art. 2.2)."],["Atenuante de confesión (art. 21.4)","Confesar antes de conocer que el procedimiento judicial se dirige contra él."]])},
{id:16,b:"Parte específica",t:"Delitos de los funcionarios públicos. Delitos contra el patrimonio y el orden socioeconómico. Delitos contra la seguridad vial. Delitos contra el orden público",n:"CP Títulos XIII, XVII, XIX y XXII",
r:["Delitos de funcionarios en el ejercicio de su cargo: prevaricación (art. 404, dictar a sabiendas una resolución arbitraria), abandono de destino y omisión del deber de perseguir delitos (art. 408), infidelidad en la custodia de documentos (art. 413), revelación de secretos (art. 417), cohecho (arts. 419-427), tráfico de influencias (art. 428) y malversación (art. 432). En otros títulos: detenciones ilegales por funcionario (art. 530) y allanamiento de domicilio por funcionario (art. 534)."].concat(O(11).r.slice(1,4)),
c:[["Prevaricación administrativa","Art. 404 CP: dictar a sabiendas una resolución arbitraria en asunto administrativo."],["Cohecho","Arts. 419-427 CP: solicitar o recibir dádivas por realizar un acto propio o contrario a su cargo."],["Omisión del deber de perseguir delitos","Art. 408 CP."]].concat(O(11).c.filter((x,i)=>i<5||i===6))},
{id:17,b:"Parte específica",t:"El homicidio y sus formas. Daños y lesiones. Delitos contra la libertad. Delitos contra la salud pública",n:"CP arts. 138-172, 263-267 y 368",
r:["Homicidio (art. 138, prisión de 10 a 15 años); asesinato (art. 139, de 15 a 25 años, con alevosía, por precio, con ensañamiento o para facilitar otro delito o evitar que se descubra; art. 140 prisión permanente revisable en supuestos agravados); homicidio imprudente (art. 142); inducción y cooperación al suicidio (art. 143).","Lesiones (art. 147): requieren objetivamente tratamiento médico o quirúrgico además de la primera asistencia; si no, delito leve. Agravadas por el arma o el medio empleado, ensañamiento o víctima vulnerable (art. 148). Pérdida de órgano o miembro principal (art. 149). Daños (art. 263): causar daños en propiedad ajena; leve si no exceden de 400 €.","Contra la libertad: detenciones ilegales y secuestros (arts. 163-168), amenazas (arts. 169-171) y coacciones (art. 172: impedir con violencia a otro hacer lo que la ley no prohíbe u obligarle a hacer lo que no quiere).","Salud pública (art. 368): actos de cultivo, elaboración o tráfico, o que promuevan, favorezcan o faciliten el consumo ilegal de drogas tóxicas, estupefacientes o psicotrópicos. Prisión de 3 a 6 años si causan grave daño a la salud y de 1 a 3 años en los demás casos. El consumo propio no es delito, pero en lugar público es infracción grave de la LO 4/2015."],
c:[["Pena del asesinato (art. 139)","Prisión de 15 a 25 años."],["Daños leves","No exceden de 400 € (art. 263)."],["Coacciones (art. 172)","Impedir con violencia a otro hacer lo que la ley no prohíbe u obligarle a hacer lo que no quiere."],["Tráfico de drogas que causan grave daño a la salud","Prisión de 3 a 6 años (art. 368)."],["Tráfico de drogas que no causan grave daño","Prisión de 1 a 3 años."]]},
{id:18,b:"Parte específica",t:"Torturas y delitos contra la integridad moral. Trata de seres humanos. Delitos contra la libertad sexual",n:"CP arts. 173-177 bis y 178-194",
r:["Integridad moral: trato degradante (art. 173.1); violencia habitual en el ámbito familiar (art. 173.2); tortura (art. 174): la comete la autoridad o funcionario que, abusando de su cargo y para obtener una confesión o información, castigarle o por discriminación, somete a una persona a condiciones o procedimientos que le supongan sufrimientos físicos o mentales. También se castiga al funcionario que permite que otros lo hagan (art. 176).","Trata de seres humanos (art. 177 bis): captar, transportar, trasladar, acoger o recibir a una persona empleando violencia, intimidación o engaño, o abusando de una situación de superioridad o vulnerabilidad, con fines de explotación (laboral, sexual, para delinquir, extracción de órganos, matrimonio forzado).","Libertad sexual tras la LO 10/2022: es agresión sexual cualquier acto que atente contra la libertad sexual de otra persona sin su consentimiento (art. 178). Solo hay consentimiento cuando se manifiesta libremente mediante actos que expresen claramente la voluntad. Si hay acceso carnal, es violación (art. 179). Los actos de carácter sexual con menores de 16 años son delito (art. 181), salvo consentimiento libre entre personas próximas en edad y grado de desarrollo.","Otros: acoso sexual (art. 184), exhibicionismo y provocación sexual (arts. 185-186) y delitos relativos a la prostitución y explotación sexual (arts. 187-190)."],
c:[["Delito de tortura","Art. 174 CP, cometido por autoridad o funcionario abusando de su cargo."],["Trata de seres humanos","Art. 177 bis CP."],["Agresión sexual tras la LO 10/2022","Cualquier acto contra la libertad sexual sin consentimiento (art. 178)."],["Edad de consentimiento sexual","16 años."],["Violación","Agresión sexual con acceso carnal (art. 179)."]]},
{id:19,b:"Parte específica",t:"Ley de Enjuiciamiento Criminal. Denuncia. Querella. Inspección ocular. Cuerpo del delito. Identidad del delincuente. Informe pericial. Juicio rápido y juicio por delitos leves",n:"LECrim",
r:["Denuncia: quien presencie un delito público está obligado a ponerlo en conocimiento del juez, fiscal o funcionario de policía más próximo (art. 259); con más razón quienes lo conozcan por su cargo o profesión (art. 262). Puede hacerse por escrito o de palabra, personalmente o por mandatario (art. 265). El denunciante no se constituye en parte.","Querella: la presenta por escrito, con abogado y procurador, quien quiere ser parte en el proceso. Todos los ciudadanos españoles, ofendidos o no, pueden querellarse ejercitando la acción popular (art. 270).","Inspección ocular (art. 326) y cuerpo del delito (art. 334): se recogen y conservan las armas, instrumentos o efectos relacionados con el delito, garantizando la cadena de custodia. Identidad del delincuente: reconocimiento en rueda (art. 368). Informe pericial (art. 456): cuando para conocer un hecho son necesarios conocimientos científicos o artísticos.","Juicio rápido (art. 795): delitos castigados con prisión de hasta 5 años u otras penas de hasta 10 años, instruidos por atestado policial, con detenido o citado ante el juzgado de guardia, si son flagrantes, de los listados en la ley (lesiones, coacciones, amenazas, violencia doméstica, hurto, robo, robo y hurto de uso de vehículos, seguridad vial, daños, salud pública, propiedad intelectual) o de instrucción sencilla.","Juicio por delitos leves (arts. 962-977): la policía cita a las partes y testigos ante el juzgado de guardia; si es posible, el juicio se celebra de inmediato.",].concat(O(12).r.filter((x,i)=>i!==4)),
c:[["Obligación de denunciar (art. 259)","Quien presencie la comisión de un delito público."],["Acción popular (art. 270)","Todos los españoles, ofendidos o no, pueden querellarse."],["Juicio rápido: pena máxima de prisión","Hasta 5 años (art. 795)."],["Reconocimiento en rueda","Art. 368 LECrim."]].concat(O(12).c.filter((x,i)=>i!==4))},
{id:20,b:"Parte específica",t:"Actuación de la Policía Local en los espectáculos públicos en Aragón. Ley de establecimientos, espectáculos públicos y actividades recreativas y normas de desarrollo",n:"Ley 11/2005 Aragón y reglamentos",
r:["La Ley 11/2005, de 28 de diciembre, regula los espectáculos públicos, las actividades recreativas y los establecimientos públicos de Aragón. Se desarrolla con el Reglamento de admisión de personas, el Reglamento de espectáculos públicos y actividades recreativas ocasionales y extraordinarias y el Catálogo de espectáculos públicos, actividades recreativas y establecimientos públicos.","Los establecimientos necesitan la licencia o título habilitante para la actividad del Catálogo que realizan; deben respetar horarios de apertura y cierre, aforo autorizado, condiciones de seguridad, seguro de responsabilidad civil y derecho de admisión según condiciones visibles y no discriminatorias. Está prohibida la venta de alcohol a menores de 18 años.","Las actividades ocasionales o extraordinarias (fiestas, conciertos al aire libre, verbenas) requieren autorización municipal o autonómica según su naturaleza y aforo, con plan de autoprotección cuando proceda.","Actuación policial: inspección (comprobar licencia, aforo, horario, salidas de emergencia, venta a menores), levantamiento de acta o denuncia, adopción de medidas provisionales en caso de riesgo (desalojo, suspensión, precinto) y comunicación al órgano competente. Las infracciones son leves, graves y muy graves; la competencia sancionadora se reparte entre el Ayuntamiento y la Comunidad Autónoma."],
c:[["Ley de espectáculos públicos de Aragón","Ley 11/2005, de 28 de diciembre."],["Normas de desarrollo que cita la convocatoria","Reglamento de admisión, Reglamento de espectáculos ocasionales y extraordinarios y Catálogo de espectáculos."],["Medidas provisionales ante riesgo grave","Desalojo, suspensión de la actividad y precinto."]]},
{id:21,b:"Parte específica",t:"La disciplina urbanística. Ley Urbanística de Aragón. Régimen sancionador urbanístico. Infracciones y sanciones",n:"DLeg 1/2014 (TR Ley de Urbanismo de Aragón)",
r:["La Ley de Urbanismo de Aragón tiene su texto refundido aprobado por el Decreto Legislativo 1/2014, de 8 de julio. Los actos de transformación, construcción, edificación y uso del suelo están sujetos a licencia urbanística, declaración responsable o comunicación previa, según su entidad.","Disciplina urbanística: la Administración protege la legalidad mediante la inspección, la suspensión de obras sin título o que no se ajustan a él, el requerimiento de legalización y, si no es posible, la orden de demolición o reposición a su estado original, además de la sanción de las infracciones.","Las infracciones urbanísticas se clasifican en leves, graves y muy graves; la competencia general para incoar y sancionar corresponde al Alcalde, con la participación de la Comunidad Autónoma en los supuestos más graves.","La Policía Local colabora inspeccionando obras, comprobando si disponen de título habilitante y si se ajustan a él, levantando acta de los hechos (con fotografías, mediciones y datos del promotor, constructor y propietario), notificando órdenes de paralización y comprobando su cumplimiento, incluso con precinto. Los hechos graves pueden ser delito contra la ordenación del territorio (arts. 319-320 CP)."],
c:[["Texto refundido de la Ley de Urbanismo de Aragón","Decreto Legislativo 1/2014, de 8 de julio."],["Órgano competente general en disciplina urbanística","El Alcalde."],["Delitos sobre la ordenación del territorio","Arts. 319-320 CP."]]},
{id:22,b:"Parte específica",t:"Igualdad de oportunidades entre mujeres y hombres en Aragón. Identidad y expresión de género e igualdad social. Prevención y protección integral de las mujeres víctimas de violencia de género",n:"Ley 7/2018 · Ley 4/2018 · Ley 4/2007 Aragón · LO 1/2004",
r:["En Aragón: Ley 7/2018, de 28 de junio, de igualdad de oportunidades entre mujeres y hombres; Ley 4/2018, de 19 de abril, de Identidad y Expresión de Género e Igualdad Social y no Discriminación; y Ley 4/2007, de 22 de marzo, de Prevención y Protección Integral a las Mujeres Víctimas de Violencia en Aragón.","Estas leyes obligan a las administraciones a integrar la perspectiva de género, a usar un lenguaje no sexista, a formar a su personal y a prestar una atención policial respetuosa con la identidad de género manifestada por la persona, sin exigir documentación para reconocerla en el trato."].concat(O(16).r),
c:[["Ley de igualdad de oportunidades de Aragón","Ley 7/2018, de 28 de junio."],["Ley de identidad y expresión de género de Aragón","Ley 4/2018, de 19 de abril."]].concat(O(16).c)},
{id:23,b:"Parte específica",t:"Responsabilidad penal de los menores. Normativa de infancia y adolescencia en Aragón. Prevención, asistencia y reinserción en drogodependencias",n:"LO 5/2000 · Ley 12/2001 · Ley 3/2001 Aragón",
r:["La LO 5/2000, de 12 de enero, se aplica a los mayores de 14 y menores de 18 años que cometen delitos. Los menores de 14 no tienen responsabilidad penal: se les aplican las normas de protección. La instrucción (expediente) corresponde al Ministerio Fiscal y el enjuiciamiento al Juez de Menores.","Detención de menores: se practica de la forma que menos les perjudique; se informa de sus derechos en lenguaje comprensible; se comunica de inmediato a sus representantes legales y al Ministerio Fiscal; se custodia en dependencias adecuadas y separadas de los adultos; plazo máximo de 24 horas para ponerlo en libertad o a disposición del Fiscal. La declaración se toma con abogado y en presencia de sus padres o del Fiscal.","Medidas (art. 7): internamiento en régimen cerrado, semiabierto, abierto o terapéutico; tratamiento ambulatorio; asistencia a centro de día; permanencia de fin de semana; libertad vigilada; convivencia con otra persona, familia o grupo educativo; prestaciones en beneficio de la comunidad; tareas socioeducativas; amonestación; privación del permiso de conducir; inhabilitación absoluta.","En Aragón, la Ley 12/2001, de 2 de julio, de la infancia y la adolescencia, regula la protección de menores (situaciones de riesgo y desamparo) por la entidad pública. La Ley 3/2001, de 4 de abril, regula la prevención, asistencia y reinserción social en materia de drogodependencias, incluidas limitaciones a la venta y consumo de alcohol y tabaco a menores."],
c:[["Edades de aplicación de la LO 5/2000","De 14 a 17 años."],["Quién instruye el expediente de menores","El Ministerio Fiscal."],["Plazo máximo de detención de un menor","24 horas."],["Ley de la infancia y la adolescencia en Aragón","Ley 12/2001, de 2 de julio."],["Ley aragonesa de drogodependencias","Ley 3/2001, de 4 de abril."]]},
{id:24,b:"Parte específica",t:"La Ley sobre tráfico, circulación de vehículos a motor y seguridad vial",n:"RDL 6/2015",r:O(14).r,c:O(14).c},
{id:25,b:"Parte específica",t:"Reglamento General de Circulación",n:"RD 1428/2003",r:O(15).r,c:O(15).c},
{id:26,b:"Parte específica",t:"Reglamento General de Conductores. Las autorizaciones administrativas para conducir",n:"RD 818/2009",
r:["El Reglamento General de Conductores (RD 818/2009) regula los permisos y licencias de conducción. Edades mínimas: AM (ciclomotores) 15 años; A1 y B1 16 años; A2, B y C1 18 años; A 20 años con al menos 2 años de antigüedad en el A2; C y D1 21 años; D 24 años.","El permiso B autoriza a conducir automóviles de hasta 3.500 kg de masa máxima autorizada y hasta 9 plazas incluido el conductor, pudiendo arrastrar un remolque ligero (hasta 750 kg). Las licencias de conducción habilitan para vehículos para personas de movilidad reducida y vehículos agrícolas.","Vigencia del permiso: AM, A1, A2, A, B y BTP, 10 años (5 años a partir de los 65); C1, C, D1 y D, 5 años (3 a partir de los 65). La vigencia está condicionada a mantener las aptitudes psicofísicas y a tener saldo de puntos.","Conducir con el permiso caducado es una infracción administrativa. Conducir habiendo perdido todos los puntos, con privación judicial o sin haber obtenido nunca permiso es delito (art. 384 CP). Los permisos extranjeros de la UE son válidos en España; los de otros países, en general, durante 6 meses desde que el titular adquiere la residencia normal."],
c:[["Edad mínima del permiso AM","15 años."],["Edad mínima del permiso A","20 años y 2 de antigüedad en el A2."],["Edad mínima del permiso D","24 años."],["Masa y plazas que autoriza el permiso B","Hasta 3.500 kg y 9 plazas incluido el conductor."],["Vigencia del permiso B","10 años; 5 a partir de los 65."]]},
{id:27,b:"Parte específica",t:"Reglamento General de Vehículos. Autorizaciones de circulación. Señales en los vehículos. ITV. Inmovilizaciones, retiradas y depósitos. Vehículos abandonados y objetos perdidos",n:"RD 2822/1998 · LSV arts. 104-106 · Código Civil art. 615",
r:["El Reglamento General de Vehículos (RD 2822/1998) regula las condiciones técnicas, la homologación, la matriculación y el permiso de circulación. Todo vehículo a motor necesita permiso de circulación y placas de matrícula; los ciclomotores, licencia o permiso y placa.","ITV de turismos de uso particular: la primera a los 4 años, luego cada 2 años hasta los 10 años y después anual. Ciclomotores: a los 3 años y después cada 2 años. Circular con la ITV desfavorable o caducada es infracción.","Inmovilización (art. 104 LSV): entre otros casos, conducir sin permiso, con alcohol o drogas, sin seguro obligatorio, con exceso de ocupantes o sin casco. Retirada y depósito (art. 105 LSV): cuando el vehículo supone peligro, obstaculiza gravemente la circulación o un servicio público, deteriora el patrimonio público, está en zona reservada a minusválidos, carga y descarga o paradas de transporte, o inmovilizado sin cesar la causa.","Vehículo abandonado (art. 106 LSV): se presume cuando permanece más de 2 meses en el depósito tras su retirada, o más de 1 mes estacionado en el mismo lugar con desperfectos que impiden moverlo por sus medios o sin placas. Se requiere al titular para que lo retire en 15 días y, si no, se trata como residuo sólido urbano.","Objetos perdidos (art. 615 Código Civil): quien encuentra una cosa mueble debe restituirla a su dueño o, si no lo conoce, entregarla al Alcalde. Se publica el hallazgo y, si en 2 años nadie la reclama, pasa al hallador."],
c:[["Primera ITV de un turismo particular","A los 4 años."],["Periodicidad de la ITV de un turismo de 4 a 10 años","Cada 2 años; después, anual."],["Presunción de abandono en la vía","Más de 1 mes en el mismo lugar con desperfectos que impiden moverlo o sin placas."],["Presunción de abandono en el depósito","Más de 2 meses tras su retirada."],["Plazo para reclamar un objeto perdido","2 años; después pertenece al hallador."]]},
{id:28,b:"Parte específica",t:"Reglamento de armas. Clasificación de las armas reglamentarias. Armas prohibidas. Guías, licencias, tarjetas y autorizaciones. Régimen sancionador",n:"RD 137/1993 (comprueba la versión vigente)",
r:["El Reglamento de Armas aprobado por el RD 137/1993 clasifica las armas reglamentadas en siete categorías: 1ª armas de fuego cortas (pistolas y revólveres); 2ª armas de fuego largas para vigilancia y guardería y rifles; 3ª otras armas largas rayadas para caza y tiro deportivo, escopetas y armas de cañón liso; 4ª carabinas y pistolas de tiro semiautomático y repetición, y revólveres de doble acción, accionados por aire u otro gas comprimido no asimiladas a escopetas; 5ª armas blancas (de hoja cortante o punzante); 6ª armas antiguas, históricas y de colección; 7ª otras armas (ballestas, armas de inyección anestésica, de alarma y señales, lanzacabos, etc.).","Armas prohibidas: entre otras, las armas de fuego camufladas o que simulen otros objetos, las armas automáticas para particulares, los bastones-estoque, los puñales de hoja menor de 11 cm de doble filo, las navajas automáticas, los puños americanos, las defensas eléctricas, los sprays de defensa personal no autorizados y las defensas de alambre o plomo.","Documentación: la guía de pertenencia acompaña a cada arma de fuego y debe llevarse con ella. Licencias: A (armas de fuego cortas y largas rayadas de funcionarios de las FCS y otros cuerpos), B (armas de fuego cortas de particulares, por necesidad), C (personal de seguridad privada), D (armas largas rayadas para caza mayor), E (escopetas y armas para caza menor y tiro), F (tiro deportivo). Tarjeta europea de armas de fuego para viajar a la UE. Autorizaciones especiales para coleccionistas y menores en actividades deportivas.","Infracciones y sanciones: la LO 4/2015 tipifica como muy graves, graves o leves diversas conductas con armas (fabricación o tenencia de armas prohibidas, portarlas sin documentación, exhibirlas de forma negligente o temeraria). La Policía Local interviene el arma, levanta acta de intervención y la deposita según el procedimiento establecido. Ha habido proyectos de nuevo Reglamento de Armas: comprueba qué texto estaba vigente en la fecha de tu convocatoria."],
c:[["Categoría de las armas de fuego cortas","1ª categoría."],["Categoría de las armas blancas","5ª categoría."],["Documento que acompaña a cada arma de fuego","La guía de pertenencia."],["Licencia de armas de los funcionarios de las FCS","Licencia A."],["Licencia para escopetas y caza menor","Licencia E."],["Licencia de vigilantes de seguridad privada","Licencia C."]]},

const CASOS2=[
{t:"Obra sin licencia en suelo urbano",tag:"Urbanismo",e:"Un vecino denuncia que en la parcela de al lado están levantando un muro de bloques de 3 metros y una caseta. Al llegar, los operarios no muestran ningún documento y el promotor no está.",p:["¿Qué compruebas?","¿Qué documento elaboras y qué datos recoges?","¿Qué medida inmediata puede adoptarse y quién la ordena?"],s:"1) Comprobar en el Ayuntamiento si existe licencia, declaración responsable o comunicación previa y si lo ejecutado se ajusta a ella. 2) Acta de inspección urbanística: situación exacta, descripción y medidas de la obra, fotografías, identificación de operarios, empresa constructora, promotor y propietario, y manifestaciones de los presentes. 3) La orden de suspensión o paralización de las obras la dicta el Alcalde (TR Ley de Urbanismo de Aragón, DLeg 1/2014); la Policía Local la notifica, comprueba su cumplimiento y, si se incumple, informa para el precinto y para el posible delito de desobediencia. 4) Se requiere al promotor para legalizar y, si no es posible, se tramita la restauración de la legalidad y el expediente sancionador. Si es suelo no urbanizable o protegido, valorar delito del art. 319 CP."},
{t:"Bar fuera de horario y con menores",tag:"Espectáculos públicos",e:"A las 3:45 un pub sigue abierto con música, aunque su horario termina a las 3:00. Dentro hay unas 180 personas en un local con aforo de 120. Ves a dos chicas que parecen menores con copas.",p:["¿Qué infracciones aprecias?","¿Cómo organizas la inspección?","¿Qué haces con los menores?"],s:"1) Infracciones de la Ley 11/2005 de Aragón: incumplimiento del horario de cierre, exceso de aforo y posible venta o suministro de alcohol a menores (también Ley 3/2001). 2) Contactar con el titular o encargado, requerir licencia y documentación, cortar la música, recuento aproximado de aforo, comprobar salidas de emergencia. Si hay riesgo, desalojo ordenado y suspensión como medida provisional. 3) Identificar a las menores, comprobar la edad, retirar las bebidas, avisar a sus padres o tutores y, si es necesario, entregárselas. 4) Acta de inspección y denuncias al órgano competente, con testigos y fotografías."},
{t:"Persona con una navaja en la vía pública",tag:"Armas",e:"En una pelea en la salida de una discoteca, un joven saca una navaja automática y la exhibe sin llegar a usarla. Al veros, la tira al suelo.",p:["¿Qué tratamiento tiene el arma?","¿Puede ser delito?","¿Qué diligencias practicas?"],s:"1) Las navajas automáticas son armas prohibidas por el Reglamento de Armas. 2) Exhibir un arma de forma intimidatoria puede ser delito de amenazas (art. 169 CP) o, si se usó contra alguien, agravar otros delitos. La tenencia de arma prohibida puede ser infracción grave de la LO 4/2015 o, según el caso, delito de tenencia de armas prohibidas (art. 563 CP). 3) Asegurar la zona, intervenir la navaja con guantes, acta de intervención y cadena de custodia. Identificar y, si procede, detener al autor e informarle de sus derechos (art. 520 LECrim). Identificar a víctimas y testigos y remitir las diligencias al juzgado y el arma al depósito establecido."},
{t:"Vehículo abandonado en la calle",tag:"Vehículos",e:"Los vecinos se quejan de una furgoneta sin placas de matrícula, con dos ruedas pinchadas y el parabrisas roto, aparcada en la misma calle desde hace casi dos meses.",p:["¿Se puede considerar abandonada?","¿Qué procedimiento sigues?"],s:"1) Sí: se presume abandonado el vehículo que lleva más de 1 mes estacionado en el mismo lugar con desperfectos que le impiden moverse por sus medios o sin placas (art. 106 LSV). 2) Comprobar en la DGT por el número de bastidor si consta como sustraído y quién es su titular. 3) Informe con fotografías y fechas. 4) Retirada al depósito municipal y requerimiento al titular para que lo retire en 15 días; si no lo hace, se trata como residuo sólido urbano. 5) Si consta como sustraído, comunicarlo a quien instruye la denuncia y al titular."},
{t:"Venta de droga a la puerta de un instituto",tag:"Salud pública / Menores",e:"Patrullando cerca de un instituto, observáis a un joven de unos 20 años que entrega pequeñas bolsitas a varios alumnos a cambio de dinero. Al identificarle lleva 14 bolsitas de hachís y 120 € en billetes pequeños.",p:["¿Qué delito puede ser?","¿Qué agravante aprecias?","¿Cómo actúas con los menores?"],s:"1) Delito contra la salud pública (art. 368 CP): el hachís se considera sustancia que no causa grave daño, prisión de 1 a 3 años. 2) Agravante específica del art. 369 CP por facilitar la droga a menores o en centros docentes o sus proximidades. 3) Detención del vendedor e información de derechos; intervención y precinto de la droga y el dinero con cadena de custodia; pesaje y remisión para análisis. 4) Identificar a los alumnos, intervenir la droga que tengan, comunicarlo a sus padres y, en su caso, a Fiscalía de Menores; la tenencia para consumo en lugar público es infracción grave de la LO 4/2015. 5) Atestado al juzgado de guardia."}

{id:32,b:"Ampliación",x:1,t:"Primeros auxilios y soporte vital básico",n:"Recomendaciones del Consejo Europeo de Resucitación",
r:["Ante cualquier emergencia, la secuencia es PAS: Proteger (a ti, a la víctima y a terceros; señalizar), Avisar (112, dando lugar exacto, número de heridos y su estado) y Socorrer.","Valoración primaria: comprobar si responde (hablarle y estimularle) y si respira con normalidad (abrir la vía aérea con la maniobra frente-mentón y mirar, oír y sentir durante no más de 10 segundos).","Si no responde y no respira con normalidad: avisar al 112, pedir un desfibrilador (DEA) e iniciar RCP: 30 compresiones torácicas en el centro del pecho, a 100-120 por minuto y con una profundidad de 5-6 cm en el adulto, seguidas de 2 ventilaciones (30:2). Al llegar el DEA, encenderlo y seguir sus instrucciones.","Si no responde pero respira con normalidad: posición lateral de seguridad y vigilar la respiración. Si hay sospecha de lesión de columna (tráfico, caídas), no moverle salvo peligro y mantener la cabeza alineada.","Atragantamiento con tos ineficaz: 5 golpes entre los omóplatos y 5 compresiones abdominales (maniobra de Heimlich), alternando. Hemorragia externa: presión directa sobre la herida; torniquete solo en hemorragias graves de extremidades que no se controlan. Quemaduras: enfriar con agua 10-20 minutos y no reventar las ampollas."],
c:[["Secuencia ante una emergencia","PAS: Proteger, Avisar y Socorrer."],["Relación compresiones/ventilaciones en RCP de adulto","30:2."],["Ritmo de las compresiones torácicas","100-120 por minuto."],["Profundidad de las compresiones en un adulto","5-6 cm."],["Víctima inconsciente que respira con normalidad","Posición lateral de seguridad."],["Atragantamiento con tos ineficaz","5 golpes interescapulares y 5 compresiones abdominales, alternando."]]},
{id:33,b:"Ampliación",x:1,t:"Policía administrativa: medio ambiente, ruido, residuos, animales y venta ambulante",n:"Ley 37/2003 · Ley 7/2010 Aragón · Ley 7/2022 · Ley 11/2003 Aragón · Ley 7/2023 · Ley 50/1999 · RD 199/2010",
r:["La Policía Local vigila el cumplimiento de las ordenanzas y bandos (art. 53.1.d LO 2/1986). Casi todas las convocatorias municipales incluyen ruido, residuos, animales, venta ambulante y ocupación de la vía pública.","Ruido: Ley 37/2003, del Ruido, y en Aragón la Ley 7/2010, de 18 de noviembre, de protección contra la contaminación acústica. Las ordenanzas fijan límites por zonas y horarios; la policía realiza mediciones con sonómetro verificado, levanta acta y denuncia.","Residuos: Ley 7/2022, de residuos y suelos contaminados. Abandonar residuos en la vía pública o en lugares no autorizados es infracción; la ordenanza regula horarios de depósito, recogida de enseres y limpieza viaria.","Animales: la Ley 11/2003, de 19 de marzo, de protección animal en la Comunidad Autónoma de Aragón, y la Ley 7/2023, de protección de los derechos y el bienestar de los animales. Animales potencialmente peligrosos (Ley 50/1999 y RD 287/2002): su tenencia exige licencia municipal (mayoría de edad, no tener antecedentes por determinados delitos, aptitud física y psicológica y seguro de responsabilidad civil), inscripción en el registro municipal, y en la vía pública bozal y correa no extensible de menos de 2 metros.","Venta ambulante (RD 199/2010): requiere autorización municipal y respetar los lugares, días y productos fijados por la ordenanza. La policía comprueba la autorización, la procedencia de la mercancía y las condiciones sanitarias, y puede intervenir el género en los casos previstos."],
c:[["Ley estatal del ruido","Ley 37/2003, de 17 de noviembre."],["Ley aragonesa de contaminación acústica","Ley 7/2010, de 18 de noviembre."],["Ley de protección animal de Aragón","Ley 11/2003, de 19 de marzo."],["Requisitos en la vía pública de un perro potencialmente peligroso","Bozal y correa no extensible de menos de 2 metros."],["Quién concede la licencia de animales potencialmente peligrosos","El Ayuntamiento."],["Norma estatal de venta ambulante","RD 199/2010."]]},
{id:34,b:"Ampliación",x:1,t:"Atestado, documentación policial y atención a las víctimas",n:"LECrim arts. 292-297 · Ley 4/2015 del Estatuto de la víctima",
r:["El atestado es el documento en el que la Policía Judicial recoge las diligencias practicadas para averiguar un delito y a sus autores (art. 292 LECrim). Lo firma quien lo extiende y las personas presentes, peritos y testigos que intervienen (art. 293). Tiene valor de denuncia (art. 297).","Plazo: la policía no puede dejar pasar más de 24 horas sin dar conocimiento a la autoridad judicial o al Ministerio Fiscal de las diligencias practicadas, salvo fuerza mayor (art. 295). Si hay detenido, se respetan además los plazos de la detención.","Estructura habitual del atestado: diligencia de inicio (cómo se conocen los hechos), inspección ocular, manifestaciones de víctimas, testigos e investigados, detención e información de derechos, intervención de efectos, informes (médicos, fotográficos), y diligencia de remisión al juzgado.","Otros documentos: parte de servicio o de intervención (uso interno), informe (a otro órgano, por ejemplo urbanismo o servicios sociales), acta (inspección o intervención de objetos), boletín de denuncia administrativa (infracciones de tráfico u ordenanzas) y comparecencia.","Estatuto de la víctima (Ley 4/2015, de 27 de abril): desde el primer contacto la víctima tiene derecho a entender y ser entendida, a recibir información sobre medidas de asistencia y apoyo, a recibir copia de su denuncia, a la traducción gratuita y a la protección de su intimidad. Se evita el contacto con el agresor y la victimización secundaria."],
c:[["Plazo para dar cuenta de las diligencias al juez o al fiscal (art. 295 LECrim)","24 horas, salvo fuerza mayor."],["Valor legal del atestado","Valor de denuncia (art. 297 LECrim)."],["Ley del Estatuto de la víctima del delito","Ley 4/2015, de 27 de abril."],["Documento para una infracción de tráfico u ordenanza","Boletín de denuncia administrativa."]]},
{id:35,b:"Ampliación",x:1,t:"Ciberdelincuencia y delitos tecnológicos",n:"CP arts. 183, 197, 197 bis, 248-249 y 264",
r:["Cada vez más denuncias que recibe la Policía Local son delitos cometidos por internet. Hay que saber orientar a la víctima, conservar pruebas y remitir al cuerpo especializado cuando proceda.","Descubrimiento y revelación de secretos (art. 197): apoderarse de mensajes, correos o datos de otro sin consentimiento. Art. 197.7: difundir sin permiso imágenes íntimas obtenidas con consentimiento. Acceso ilícito a sistemas informáticos (art. 197 bis).","Estafa (art. 248): engaño bastante para que otro realice un acto de disposición en su perjuicio, incluida la manipulación informática (phishing, compras falsas, suplantación). Es delito leve si no supera 400 €. Daños informáticos (art. 264): borrar, dañar o hacer inaccesibles datos o programas ajenos.","Menores: el contacto con un menor de 16 años por medios tecnológicos para proponerle un encuentro con fines sexuales o para obtener material sexual (child grooming, art. 183). El ciberacoso puede encajar en acoso (art. 172 ter), amenazas o delitos contra la integridad moral.","Actuación: no borrar nada, hacer capturas con fecha y URL, conservar el dispositivo, anotar perfiles, teléfonos y números de operación, avisar al banco de inmediato si hay fraude, y recoger la denuncia o derivarla a la unidad especializada."],
c:[["Acceso ilícito a un sistema informático","Art. 197 bis CP."],["Difundir sin permiso imágenes íntimas obtenidas con consentimiento","Art. 197.7 CP."],["Estafa leve","No supera 400 €."],["Child grooming","Art. 183 CP: contacto tecnológico con menores de 16 con fines sexuales."],["Daños informáticos","Art. 264 CP."]]},
{id:36,b:"Ampliación",x:1,t:"Policía de proximidad, mediación y atención al ciudadano",n:"LO 2/1986 art. 53.1.i · técnicas de mediación",
r:["La policía de proximidad trabaja con el barrio de forma preventiva: conocer a vecinos y comercios, detectar problemas antes de que sean delitos y coordinarse con servicios sociales, centros educativos y asociaciones.","La Policía Local coopera en la resolución de conflictos privados cuando es requerida (art. 53.1.i LO 2/1986): ruidos entre vecinos, comunidades de propietarios, conflictos familiares sin delito o disputas de convivencia.","Técnicas de mediación: presentarse y explicar el papel del agente; separar a las partes si hay tensión; escucha activa (dejar hablar, asentir, no interrumpir); parafrasear para mostrar que se ha entendido; preguntas abiertas; centrarse en intereses y no en posiciones; neutralidad; buscar acuerdos concretos y realistas; dejar constancia.","Comunicación ante personas alteradas: tono calmado, distancia de seguridad, frases cortas, ofrecer opciones, evitar amenazas innecesarias y no tomarse los insultos como algo personal. La fuerza es el último recurso.","Atención a colectivos vulnerables: mayores, personas con discapacidad, menores, víctimas y personas sin hogar. Derivar a servicios sociales cuando proceda."],
c:[["Precepto que habilita la mediación de la Policía Local","Art. 53.1.i LO 2/1986."],["Técnica de repetir con tus palabras lo que dice la persona","Parafrasear."],["Principio clave del mediador","Neutralidad."]]}
);

function temaPaso(id){const s=S.temas[id]||0,a=temaAcc(id);return{leido:s>=1,test:!!(a&&a.n>=5&&a.p>=.7),dom:s>=3}}
function faseDone(f){return faseTemas(f).every(id=>temaPaso(id).dom)&&f.pasos.every(p=>{try{return p[1]()}catch(e){return false}})}
function faseActual(){for(const f of FASES){if(!faseDone(f))return f}return FASES[FASES.length-1]}
function temaActual(){const f=faseActual();const id=faseTemas(f).find(id=>!temaPaso(id).dom);if(id)return TEMA(id);const any=OFICIALES.find(t=>!temaPaso(t.id).dom);return any||null}
function sigPaso(){const f=faseActual();if(f.n===0){const p=f.pasos.find(p=>!p[1]());if(p)return{t:p[0],go:p[2]}}
 const t=faseTemas(f).map(TEMA).find(t=>!temaPaso(t.id).dom);if(t){const tp=temaPaso(t.id);return !tp.leido?{t:"Lee el tema "+t.id+": "+t.t.split(/[.:]/)[0],go:"tema",id:t.id}:!tp.test?{t:"Saca un 70% en el test del tema "+t.id,go:"testtema",id:t.id}:{t:"Marca el tema "+t.id+" como dominado cuando te lo sepas",go:"tema",id:t.id}}
 const p=f.pasos.find(p=>{try{return!p[1]()}catch(e){return true}});return p?{t:p[0],go:p[2]}:{t:"¡Ruta completada! Mantén los simulacros y las tarjetas.",go:"sim100"}}

const ADD=(id,paras,keys)=>{const t=TEMAS.find(x=>x.id===id);t.r=t.r.concat(paras);t.c=t.c.concat(keys||[])};
ADD(3,["Principios de actuación de la Administración: el art. 103 CE exige servir con objetividad a los intereses generales y actuar según los principios de eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho. El art. 3 de la Ley 40/2015 añade, entre otros: servicio efectivo a los ciudadanos; simplicidad, claridad y proximidad; participación, objetividad y transparencia; racionalización y agilidad; buena fe, confianza legítima y lealtad institucional; responsabilidad por la gestión pública; planificación y dirección por objetivos; eficacia y eficiencia; seguridad jurídica; y cooperación, colaboración y coordinación entre Administraciones.","Particularidades locales: los actos y acuerdos de las entidades locales que infrinjan el ordenamiento pueden ser impugnados por el Estado o la Comunidad Autónoma. Pueden requerir a la entidad local que anule el acto en un plazo de 15 días hábiles desde que lo reciben, y la entidad dispone de un mes como máximo para hacerlo; si no, pueden ir a la jurisdicción contencioso-administrativa (art. 65 LBRL). El Secretario municipal ejerce la fe pública y el asesoramiento legal preceptivo."],
 [["Principios del art. 103 CE","Eficacia, jerarquía, descentralización, desconcentración y coordinación."],["Plazo del Estado o la CA para requerir la anulación de un acto local (art. 65 LBRL)","15 días hábiles desde que lo reciben."]]);
ADD(4,["Estructura del Estatuto (LO 5/2007): Preámbulo, Título Preliminar y nueve títulos (derechos y principios rectores, instituciones, Administración de Justicia, organización territorial y gobierno local, competencias, cooperación institucional y acción exterior, economía y hacienda, y reforma del Estatuto).","Competencias de la Comunidad Autónoma: exclusivas (art. 71), compartidas con el Estado (art. 75) y ejecutivas (art. 77). Entre las exclusivas están la organización de sus instituciones, el Derecho foral aragonés, el régimen local, la ordenación del territorio, el urbanismo y la vivienda, el turismo, el deporte, los espectáculos y actividades recreativas, la acción social y la coordinación de las policías locales. El art. 76 permite crear una Policía autonómica."],
 [["Artículo de las competencias exclusivas de Aragón","Art. 71 del Estatuto."],["Artículo de las competencias compartidas","Art. 75 del Estatuto."],["Artículo de las competencias ejecutivas","Art. 77 del Estatuto."],["Artículo que prevé la Policía autonómica de Aragón","Art. 76 del Estatuto."]]);
ADD(7,["El ciudadano como cliente y usuario: tiene derecho a servicios de calidad, a ser informado y orientado, a un trato respetuoso, a presentar quejas, reclamaciones y sugerencias y a que se le conteste. Muchos ayuntamientos publican cartas de servicios con compromisos de calidad medibles. Para la Policía Local esto se traduce en atención próxima, información clara, identificación del agente y respuesta en plazo."],[["Instrumento con compromisos públicos de calidad de un servicio","La carta de servicios."]]);
ADD(8,["Reglamentos y ordenanzas habituales en un Ayuntamiento: Reglamento Orgánico Municipal (organización y funcionamiento), Reglamento del Cuerpo de Policía Local, ordenanza de circulación y movilidad, ordenanza de convivencia o civismo, de terrazas y veladores, de protección contra ruidos, de limpieza y residuos, de tenencia y protección de animales, de venta ambulante y de ocupación de la vía pública. Para tu convocatoria concreta, estudia las del municipio.","Las ordenanzas fiscales regulan los tributos locales. Impuestos obligatorios: sobre Bienes Inmuebles (IBI), sobre Actividades Económicas (IAE) y sobre Vehículos de Tracción Mecánica (IVTM). Potestativos: sobre Construcciones, Instalaciones y Obras (ICIO) y sobre el Incremento de Valor de los Terrenos de Naturaleza Urbana (plusvalía). Además, tasas y precios públicos."],
 [["Impuestos municipales obligatorios","IBI, IAE e IVTM."],["Impuestos municipales potestativos","ICIO y plusvalía (IIVTNU)."]]);
ADD(9,["Régimen disciplinario de la Policía Local. El art. 52 LO 2/1986 remite a los principios de la ley y a la normativa autonómica y municipal; la LO 4/2010, del régimen disciplinario del Cuerpo Nacional de Policía, se aplica a las policías locales con las adaptaciones de la normativa autonómica (en Aragón, la Ley 8/2013). Comprueba en el texto vigente cómo encaja en tu convocatoria.","Faltas muy graves (ejemplos de la LO 4/2010): incumplir el deber de fidelidad a la Constitución; cualquier conducta discriminatoria; el abuso de atribuciones con grave daño; la práctica de tratos inhumanos, degradantes o vejatorios; el abandono del servicio; la publicación o uso indebido de documentos secretos; la participación en huelgas o acciones sustitutivas; y la condena por delito doloso relacionado con el servicio.","Sanciones: por faltas muy graves, separación del servicio o suspensión de funciones de 3 meses y 1 día a 6 años; por graves, suspensión de 5 días a 3 meses; por leves, suspensión de 1 a 4 días o apercibimiento. Prescripción de las faltas: muy graves a los 3 años, graves a los 2 años y leves al mes.","Procedimiento: se inicia de oficio por la autoridad competente, con instructor y secretario; pliego de cargos, alegaciones, prueba, propuesta de resolución y resolución. Durante la tramitación por falta grave o muy grave puede acordarse la suspensión provisional del funcionario. Las faltas leves se tramitan por un procedimiento abreviado, más simple y rápido, con audiencia del interesado."],
 [["Prescripción de las faltas leves (LO 4/2010)","1 mes."],["Sanción máxima por falta grave","Suspensión de funciones de 5 días a 3 meses."],["Sanciones por faltas leves","Suspensión de 1 a 4 días o apercibimiento."],["Sanciones por faltas muy graves","Separación del servicio o suspensión de 3 meses y 1 día a 6 años."]]);
ADD(12,["Disposiciones estatutarias comunes (arts. 5 a 8): además de los principios básicos de actuación, los miembros de las FCS tienen derecho a una remuneración justa, a formación permanente y a la promoción profesional (art. 6); no pueden ejercer el derecho de huelga ni acciones sustitutivas que alteren el normal funcionamiento de los servicios (art. 6.8); tienen la condición de agentes de la autoridad y la agresión contra ellos es atentado (art. 7); y están sujetos a la jurisdicción ordinaria por los delitos que cometan (art. 8). Deben guardar secreto profesional (art. 5.5) y responden personal y directamente por sus actos (art. 5.6)."],[["Artículo que prohíbe la huelga a las FCS","Art. 6.8 LO 2/1986."],["Principio del art. 5.6","Responsabilidad personal y directa por los actos en el servicio."]]);
ADD(13,["Estructura de los cuerpos: la Ley 8/2013 organiza los cuerpos en escalas y categorías. La de Policía (la de ingreso) y la de Oficial se clasifican en el subgrupo C1; por encima están las categorías de mando, como Subinspector (A2) e Intendente principal (A1), que aparecen en las convocatorias del Ayuntamiento de Zaragoza. Lee en el texto vigente las escalas, el sistema de acceso a cada categoría y la promoción interna.","Segunda actividad: situación administrativa a la que pasa el policía, por edad o por disminución de sus aptitudes psicofísicas, para seguir prestando servicio en puestos adecuados a sus condiciones. Repasa en la ley sus requisitos y efectos.","Normas marco y reglamentos: la Comunidad Autónoma dicta normas marco y reglamentos que los ayuntamientos desarrollan en sus reglamentos de cuerpo: el Reglamento marco de organización (Decreto 222/1991) y el Decreto 10/2023 de la Academia Aragonesa de Policías Locales, que regula la formación y el temario de acceso (art. 23)."],[["Norma que fija el temario de acceso en Aragón","Art. 23 del Decreto 10/2023."],["Situación del policía que deja el servicio ordinario por edad o por aptitudes psicofísicas","Segunda actividad."]]);
ADD(15,["Clases de penas: privativas de libertad (prisión permanente revisable, prisión, localización permanente y responsabilidad personal subsidiaria por impago de multa); privativas de derechos (inhabilitación absoluta o especial, suspensión de empleo o cargo, privación del derecho a conducir, privación del derecho a la tenencia de armas, prohibición de residir, de aproximarse o de comunicarse con la víctima, y trabajos en beneficio de la comunidad); y multa.","La prisión tiene una duración mínima de 3 meses (art. 36). La localización permanente, de hasta 6 meses (art. 37). La multa se impone por el sistema de días-multa: entre 10 días y 2 años, con una cuota diaria de 2 a 400 € (art. 50). Las penas pueden ser principales o accesorias."],[["Duración mínima de la pena de prisión","3 meses."],["Cuota diaria de la multa","De 2 a 400 €."],["Duración máxima de la localización permanente","6 meses."]]);
ADD(16,["Contra el patrimonio y el orden socioeconómico, además del hurto y el robo: extorsión (art. 243), usurpación (art. 245), apropiación indebida (art. 253: quedarse con dinero o bienes recibidos en depósito o administración), receptación (art. 298: con ánimo de lucro y sabiendo que proceden de un delito contra el patrimonio, adquirir, recibir u ocultar esos efectos, o ayudar a aprovecharse de ellos), blanqueo de capitales (art. 301), y delitos contra la propiedad intelectual (art. 270) e industrial (art. 274: por ejemplo, la venta de productos falsificados)."],[["Receptación","Art. 298 CP."],["Apropiación indebida","Art. 253 CP."],["Venta de productos con marcas falsificadas","Art. 274 CP (propiedad industrial)."]]);
ADD(20,["Obligaciones habituales de los establecimientos: exhibir en lugar visible el aforo y el horario autorizados y las condiciones del derecho de admisión; disponer de hojas de reclamaciones; contar con seguro de responsabilidad civil; respetar las condiciones de insonorización, evacuación y seguridad; y no vender ni servir alcohol a menores. Los horarios generales los fija la Comunidad Autónoma, y los ayuntamientos pueden ajustarlos en casos concretos."],[["¿Qué debe exhibir en lugar visible un local de ocio?","Aforo, horario autorizado y condiciones del derecho de admisión."]]);
ADD(21,["Títulos habilitantes: según la actuación, licencia urbanística, declaración responsable o comunicación previa. Responsables de las infracciones: el promotor, el constructor y el técnico director de la obra, cada uno en su ámbito. La restauración de la legalidad (legalizar, demoler o reponer) es independiente de la sanción: se puede exigir aunque la infracción haya prescrito o se haya sancionado. Repasa en el DLeg 1/2014 la clasificación de infracciones, las cuantías de las multas y los plazos de prescripción."],[["Responsables de una infracción urbanística","Promotor, constructor y técnico director."],["¿La restauración de la legalidad depende de la sanción?","No, es independiente."]]);
ADD(25,["Prioridad de paso: en intersecciones sin señalizar, tiene preferencia el vehículo que se aproxima por la derecha (art. 57), salvo que los vehículos que circulan por vía pavimentada la tienen sobre los de vía sin pavimentar y los que circulan por raíles sobre los demás. En las glorietas, los que están dentro tienen preferencia sobre los que pretenden entrar.","Adelantamiento: como norma general por la izquierda (art. 82). Se puede adelantar por la derecha al vehículo que indica que va a girar a la izquierda o a detenerse en ese lado. Está prohibido adelantar en curvas y cambios de rasante de visibilidad reducida, en pasos de peatones señalizados y, con excepciones, en intersecciones. Al adelantar a ciclistas o vehículos de dos ruedas hay que dejar una separación lateral mínima de 1,5 metros.","Parada y estacionamiento: parada es la inmovilización de un vehículo durante menos de 2 minutos sin que el conductor lo abandone; estacionamiento es cualquier inmovilización que no sea parada. Está prohibido estacionar, entre otros, en doble fila, en pasos de peatones, en vados, en carriles bus, en zonas de carga y descarga en su horario y en plazas reservadas a personas con discapacidad sin autorización.","Otros: las señales de los agentes prevalecen sobre todas. Brazo levantado verticalmente: obliga a detenerse a todos los usuarios que se acerquen, salvo a los que no puedan hacerlo con seguridad. Brazos extendidos horizontalmente: obligan a detenerse a quienes llegan por las direcciones que cortan los brazos. Los ciclistas deben usar casco en vías interurbanas, y los menores de 16 años en todas las vías. Los peatones, en vías interurbanas sin acera, circulan por la izquierda."],

 const proxTest=(()=>{for(let i=0;i<20;i++){const d=new Date(lunesDe(new Date()).getTime()+i*7*DAY);if(esSemanaTest(d)){const tday=new Date(d.getTime()+5*DAY);if(tday>=new Date(Date.now()-DAY))return tday}}return null})();
 return `<section class="panel stack"><div class="eyebrow">Plan de entrenamiento · ${esc(convSel().n)}</div><h2>Fase ${esc(FASEN[fase])}</h2><p class="muted">${esc(FASED[fase])}</p>
