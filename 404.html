<title>Opositor Policía Local Aragón</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: cuaderno de servicio. Cabecera con banda de damero policial, navegación por secciones y paneles de trabajo en una columna ancha. */
:root{
  --bg:#eef1f6; --surface:#ffffff; --surface2:#f5f7fb; --fg:#132036; --muted:#5b6880; --line:#d6dce8;
  --accent:#1c3f94; --accent-ink:#ffffff; --accent-soft:#e2e9fa; --gold:#e9b10a; --gold-ink:#3b2a00;
  --ok:#17784a; --ok-soft:#dcf2e6; --ko:#b8322a; --ko-soft:#f8e0de; --warn:#9a6a08; --warn-soft:#fbefd2;
  --chk1:#1c3f94; --chk2:#ffffff;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Source Sans 3","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c1322; --surface:#131d31; --surface2:#18243b; --fg:#e5ebf5; --muted:#9aa8c0; --line:#283754;
  --accent:#86a6ff; --accent-ink:#0c1322; --accent-soft:#1d2c4f; --gold:#f2c433; --gold-ink:#2a1e00;
  --ok:#4cc68a; --ok-soft:#143526; --ko:#f0786f; --ko-soft:#3d1a19; --warn:#e9b44c; --warn-soft:#3a2c0f;
  --chk1:#2a4fae; --chk2:#dfe6f5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1322; --surface:#131d31; --surface2:#18243b; --fg:#e5ebf5; --muted:#9aa8c0; --line:#283754;
  --accent:#86a6ff; --accent-ink:#0c1322; --accent-soft:#1d2c4f; --gold:#f2c433; --gold-ink:#2a1e00;
  --ok:#4cc68a; --ok-soft:#143526; --ko:#f0786f; --ko-soft:#3d1a19; --warn:#e9b44c; --warn-soft:#3a2c0f;
  --chk1:#2a4fae; --chk2:#dfe6f5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;text-wrap:balance;margin:0}
h1{font-size:2.3rem} h2{font-size:1.75rem} h3{font-size:1.3rem} h4{font-size:1.1rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.chk{height:12px;background:repeating-conic-gradient(var(--chk1) 0 25%,var(--chk2) 0 50%) 0 0/12px 12px}
.brand{display:flex;align-items:center;gap:12px;padding-block:10px}
.badge{width:38px;height:42px;flex:none;background:var(--accent);clip-path:polygon(50% 0,100% 14%,100% 60%,50% 100%,0 60%,0 14%);display:grid;place-items:center;color:var(--accent-ink);font-family:var(--f-display);font-weight:700;font-size:15px}
.brand-t{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1}
.brand-s{font-size:.82rem;color:var(--muted)}
.brand .sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:.8rem;font-weight:600;background:var(--surface2);border:1px solid var(--line);white-space:nowrap}
.pill.gold{background:var(--gold);color:var(--gold-ink);border-color:transparent}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.ko{background:var(--ko-soft);color:var(--ko);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 9px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);cursor:pointer;white-space:nowrap}
nav.tabs button[aria-current="page"]{color:var(--fg);border-bottom-color:var(--gold)}
nav.tabs button:hover{color:var(--fg)}
main{padding-block:24px 64px;display:grid;gap:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;min-width:0}
.panel.flat{background:transparent;border:0;padding:0}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.stack{display:grid;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.85em}
.num{font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.pri:hover{filter:brightness(1.08)}
.btn.gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
.btn.sm{padding:5px 11px;font-size:.88rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],select,textarea{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
textarea{width:100%;min-height:110px;resize:vertical}
label.f{display:grid;gap:4px;font-size:.88rem;font-weight:600;color:var(--muted)}
/* hero */
.hero{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:stretch}
@media (max-width:760px){.hero{grid-template-columns:1fr}}
.count{background:var(--accent);color:var(--accent-ink);border-radius:var(--r);padding:20px;display:grid;gap:6px;align-content:start;position:relative;overflow:hidden}
.count .big{font-family:var(--f-display);font-size:4.2rem;font-weight:700;line-height:.9}
.count .chk{position:absolute;left:0;right:0;bottom:0;opacity:.35}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.tile .v{font-family:var(--f-display);font-size:2.1rem;font-weight:700;line-height:1}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.g > i{background:var(--ok)}
.list{display:grid;gap:0}
.list > *{padding:10px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0}
.phase{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:start}
.phase b.n{width:30px;height:30px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-size:1.1rem}
/* temario */
.tema{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%}
.tema:hover{border-color:var(--accent)}
.tema .tn{font-family:var(--f-display);font-size:1.5rem;font-weight:700;color:var(--accent);text-align:center}
.tema .tt{font-weight:600;line-height:1.3}
.tema .meta{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
@media (max-width:560px){.tema{grid-template-columns:36px 1fr}.tema .meta{grid-column:2;flex-direction:row;align-items:center}}
.reading{max-width:70ch;display:grid;gap:14px}
.keys{width:100%;border-collapse:collapse}
.keys td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.keys td:first-child{font-weight:600;width:45%}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:7px 12px;cursor:pointer;font-weight:600;font-size:.9rem;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
/* test */
.q{font-size:1.15rem;font-weight:600;line-height:1.4}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;text-align:left;padding:12px 14px;border:1.5px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .l{width:28px;height:28px;border-radius:6px;background:var(--surface2);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;border:1px solid var(--line)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .l{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.good .l{background:var(--ok);color:var(--surface);border-color:var(--ok)}
.opt.bad{border-color:var(--ko);background:var(--ko-soft)}
.opt.bad .l{background:var(--ko);color:var(--surface);border-color:var(--ko)}
.opt:disabled{cursor:default}
.expl{padding:12px 14px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line)}
.qgrid{display:flex;flex-wrap:wrap;gap:5px}
.qgrid button{width:34px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:.82rem;font-variant-numeric:tabular-nums}
.qgrid button.a{background:var(--accent-soft);border-color:var(--accent)}
.qgrid button.cur{outline:2px solid var(--gold)}
.timer{font-family:var(--f-mono);font-size:1.05rem}
.score{font-family:var(--f-display);font-size:4.5rem;font-weight:700;line-height:.9}
.rev{padding:12px 0;border-top:1px solid var(--line);display:grid;gap:4px}
/* tarjetas */
.card{min-height:220px;border-radius:14px;border:1px solid var(--line);background:var(--surface);padding:24px;display:grid;align-content:center;gap:12px;text-align:center;cursor:pointer;position:relative;overflow:hidden}
.card .chk{position:absolute;inset:0 0 auto}
.card .front{font-size:1.25rem;font-weight:600}
.card .back{font-size:1.15rem;color:var(--accent);font-weight:600}
.boxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.boxes div{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px;text-align:center}
.boxes b{display:block;font-family:var(--f-display);font-size:1.4rem}
/* localidades */
.locs{display:flex;flex-wrap:wrap;gap:6px}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}
.check input{margin-top:4px;width:18px;height:18px;accent-color:var(--accent)}
details.case{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:0}
details.case summary{cursor:pointer;padding:16px 18px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
details.case summary::-webkit-details-marker{display:none}
details.case .in{padding:0 18px 18px;display:grid;gap:12px}
.sol{padding:14px;border-radius:var(--r);background:var(--ok-soft);border:1px solid var(--ok)}
.tablewrap{overflow-x:auto}
table.plan{width:100%;border-collapse:collapse;font-size:.93rem}
table.plan th,table.plan td{padding:9px 10px;border-top:1px solid var(--line);text-align:left;vertical-align:top}
table.plan th{font-family:var(--f-display);font-size:1rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
table.plan tr.now td{background:var(--accent-soft)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:600;z-index:20;max-width:calc(100% - 32px)}
.spark{display:block}
.note{border-left:4px solid var(--gold);padding:10px 14px;background:var(--surface2);border-radius:0 8px 8px 0}
@media (prefers-reduced-motion:no-preference){.card,.opt,.btn{transition:border-color .15s,background-color .15s}}
@media (max-width:560px){h1{font-size:1.9rem}.count .big{font-size:3.4rem}.panel{padding:16px}}

.brand .sp{flex:1}.brand{flex-wrap:wrap}
@media (max-width:560px){#sync{display:none}}
.onb{border:2px solid var(--gold)}
.missions{display:grid;gap:8px}
.mis{display:grid;grid-template-columns:28px 1fr auto auto;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface2)}
.mis .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--surface)}
.mis.done{background:var(--ok-soft);border-color:var(--ok)}.mis.done .tick{background:var(--ok);border-color:var(--ok)}
.bar.inv{background:rgba(255,255,255,.25);border-color:transparent}.bar.inv>i{background:var(--gold)}
.focoT{font-family:var(--f-display);font-size:3rem;font-weight:700;line-height:1}
.chat{display:flex;flex-direction:column;gap:10px;max-height:460px;overflow-y:auto;padding:4px}
.msg{max-width:88%;padding:10px 14px;border-radius:14px;line-height:1.45;overflow-wrap:anywhere}
.msg.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.msg.pr{align-self:flex-start;background:var(--surface2);border:1px solid var(--line);border-bottom-left-radius:4px}
.prose{overflow-wrap:anywhere}
.overlay{position:fixed;inset:0;background:rgba(5,10,20,.55);display:grid;place-items:center;z-index:30;padding:16px}
.ovbox{background:var(--surface);color:var(--fg);border-radius:14px;padding:28px 24px 22px;max-width:420px;width:100%;text-align:center;display:grid;gap:12px;position:relative;overflow:hidden}
.ovbox .chk{position:absolute;inset:0 0 auto}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:31}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px;overflow-x:auto;padding-bottom:4px}
.heat i{width:14px;height:14px;border-radius:3px;background:var(--surface2);border:1px solid var(--line);display:block}
.heat i.fz{background:var(--gold);opacity:.6}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px}
.badge2{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:grid;gap:2px;opacity:.55}
.badge2.on{opacity:1;border-color:var(--gold);background:var(--surface2)}
.badge2 .bi{font-size:1.4rem;color:var(--gold)}
.ranks{display:flex;flex-wrap:wrap;gap:6px}
ol.clean,ul.clean{margin:0;padding-left:20px;display:grid;gap:6px}
.big2{font-size:1.3rem;letter-spacing:.08em;word-break:break-all}
.opt .mono{word-break:break-all}

nav.tabs button{display:inline-flex;align-items:center;gap:6px;position:relative}
nav.tabs .dot{position:absolute;top:6px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--ko)}
@media (max-width:760px){
 nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:12;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;gap:0;padding:4px max(4px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(4px,env(safe-area-inset-left,0px));overflow:visible}
 nav.tabs button{flex-direction:column;gap:2px;font-size:.72rem;padding:6px 2px;border-bottom:0;border-top:3px solid transparent;flex:1;min-width:0;letter-spacing:.02em}
 nav.tabs button[aria-current="page"]{border-bottom:0;border-top-color:var(--gold);color:var(--accent)}
 main{padding-bottom:110px}
 .brand{padding-block:8px}
}
.btn.ghost{background:transparent;border-color:transparent;color:var(--muted);padding-left:0}
.btn.big{font-size:1.1rem;padding:14px 26px}
.linkish{background:none;border:0;padding:0;text-align:left;cursor:pointer;color:var(--fg);font:inherit}
.linkish:hover{color:var(--accent)}
.wrapseg{flex-wrap:wrap}
.today{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.today-h{background:var(--accent);color:var(--accent-ink);padding:20px;display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;justify-content:space-between;position:relative}
.today-h h1{font-size:2rem;margin-block:4px 10px}
.eyebrow.inv{color:inherit;opacity:.85}
.pill.inv{background:rgba(255,255,255,.16);color:inherit;border-color:transparent}
ol.steps{list-style:none;margin:0;padding:8px 20px;display:grid}
.step{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.step:first-child{border-top:0}
.step .sn{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.1rem;background:var(--accent-soft);color:var(--accent)}
.step .st{display:grid;gap:1px;min-width:0}
.step.done .sn{background:var(--ok);color:var(--surface)}
.step.done .st b{text-decoration:line-through;color:var(--muted)}
@media (max-width:560px){.step{grid-template-columns:32px 1fr}.step>.row{grid-column:2}}
.nots{display:flex;flex-wrap:wrap;gap:6px 14px;padding:12px 20px;background:var(--ko-soft);color:var(--ko);font-size:.9rem;align-items:baseline}
.nots b{margin-right:4px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.wd{display:grid;gap:2px;text-align:center;padding:8px 2px;border-radius:8px;background:var(--surface2);font-size:.72rem;line-height:1.2;min-width:0}
.wd b{font-family:var(--f-display);font-size:.95rem}
.wd.cur{background:var(--accent);color:var(--accent-ink)}
.nextb{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;padding:14px 18px;border-radius:var(--r);background:var(--accent-soft);border:1px solid var(--accent)}
.nextb .small{flex-basis:100%;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem}
.nextb b{flex:1;min-width:180px}
.nextb.done{background:var(--ok-soft);border-color:var(--ok)}
.timeline{display:grid;gap:10px}
details.fase{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
details.fase summary{display:flex;gap:12px;align-items:center;padding:14px 16px;cursor:pointer;list-style:none}
details.fase summary::-webkit-details-marker{display:none}
details.fase summary>div{display:grid;flex:1;min-width:0}
details.fase .fn{width:36px;height:36px;flex:none;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:1.2rem;background:var(--surface2);border:2px solid var(--line)}
details.fase.cur{border:2px solid var(--gold)}
details.fase.cur .fn{background:var(--gold);color:var(--gold-ink);border-color:var(--gold)}
details.fase.done .fn{background:var(--ok);color:var(--surface);border-color:var(--ok)}
details.fase.next{opacity:.8}
details.fase .in{padding:0 16px 16px;display:grid;gap:10px}
details.fase .nots{border-radius:8px}
.trow{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}
.dots{display:flex;gap:4px}
.dots i{font-style:normal;font-size:.7rem;padding:2px 7px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.dots i.on{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.check .ck{width:22px;height:22px;flex:none;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;font-weight:700;color:var(--surface)}
.check .ck.on{background:var(--ok);border-color:var(--ok)}
.check{align-items:center}
.hubs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}
.hub{display:grid;gap:6px;justify-items:start;text-align:left;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;color:var(--fg)}
.hub b{font-family:var(--f-display);font-size:1.35rem}
.hub:hover{border-color:var(--accent)}
.hub.gold{border:2px solid var(--gold)}
.resbox{border:2px solid var(--accent)}

.hbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);font-family:var(--f-display);font-weight:700;font-size:1.1rem;cursor:pointer;color:var(--fg)}
.convc{border:2px solid var(--accent)}
.trio{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.trio>div{display:grid;gap:4px;align-content:start;padding:10px 12px;background:var(--surface2);border-radius:8px;min-width:0}
.trio b{font-family:var(--f-display);font-size:1.5rem;line-height:1.05}
@media (max-width:560px){.trio{grid-template-columns:1fr}}
.c-ok{color:var(--ok)}.c-warn{color:var(--warn)}.c-ko{color:var(--ko)}
.convs{display:grid;gap:10px}
.convo{display:grid;gap:4px;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.convo.on{border:2px solid var(--gold);background:var(--surface2)}
.guia{max-width:760px;width:100%;margin:0 auto;display:grid;gap:14px;position:relative;overflow:hidden;padding-top:28px}
.guia>.chk{position:absolute;inset:0 0 auto}
.guia h1{font-size:2.2rem}
.lead{font-size:1.1rem;color:var(--muted);margin-top:-6px}
.gbody p{max-width:65ch}
.gprog{display:flex;gap:6px}
.gprog i{flex:1;height:6px;border-radius:99px;background:var(--surface2);border:1px solid var(--line)}
.gprog i.on{background:var(--gold);border-color:var(--gold)}
.gsec{display:grid;gap:2px;padding:10px 12px;border-left:4px solid var(--accent);background:var(--surface2);border-radius:0 8px 8px 0}
.gsec b{font-family:var(--f-display);font-size:1.2rem}
.gsteps{display:grid;gap:10px}

body.locked #tabs,body.locked #sync,body.locked #hdrLvl,body.locked .hbtn{display:none}
.lock{max-width:420px;width:100%;margin:6vh auto 0;display:grid;gap:12px;justify-items:center;text-align:center;position:relative;overflow:hidden;padding-top:28px}
.lock>.chk{position:absolute;inset:0 0 auto}
.lock .badge{width:56px;height:62px;font-size:20px}
.lock input{font-size:1.6rem;letter-spacing:.4em;text-align:center;width:min(100%,220px)}
.lock details{width:100%;text-align:left}

<script>
/* ====== DATOS: TEMARIO ====== */
const OLD = [
{id:1,b:"Constitución",t:"Constitución Española (I): estructura, Título Preliminar y derechos fundamentales",n:"CE 1978 · arts. 1-55",
r:["La Constitución fue aprobada por las Cortes el 31 de octubre de 1978, ratificada en referéndum el 6 de diciembre, sancionada por el Rey el 27 de diciembre y publicada en el BOE el 29 de diciembre de 1978. Consta de un Preámbulo, 169 artículos repartidos en un Título Preliminar y diez Títulos, 4 disposiciones adicionales, 9 transitorias, 1 derogatoria y 1 final.",
"El Título Preliminar (arts. 1-9) define a España como Estado social y democrático de Derecho, con valores superiores (libertad, justicia, igualdad y pluralismo político). La soberanía nacional reside en el pueblo español y la forma política es la Monarquía parlamentaria.",
"El Título I (arts. 10-55) regula los derechos y deberes. El nivel máximo de protección (art. 53.2: procedimiento preferente y sumario y recurso de amparo) corresponde al art. 14 y a la Sección 1ª del Capítulo II (arts. 15-29), más la objeción de conciencia del art. 30.",
"Para un policía son esenciales: art. 17 (libertad y detención), art. 18 (intimidad, domicilio, secreto de comunicaciones), art. 19 (circulación), art. 20 (expresión), art. 21 (reunión y manifestación), art. 24 (tutela judicial y presunción de inocencia), art. 25 (legalidad penal) y art. 55 (suspensión de derechos)."],
c:[["Valores superiores del ordenamiento (art. 1.1)","Libertad, justicia, igualdad y pluralismo político."],["Forma política del Estado (art. 1.3)","Monarquía parlamentaria."],["Plazo máximo de detención preventiva (art. 17.2)","72 horas; después, libertad o disposición judicial."],["Procedimiento para la inmediata puesta a disposición judicial de detenido ilegal (art. 17.4)","Habeas corpus (LO 6/1984)."],["Entrada en domicilio sin consentimiento (art. 18.2)","Solo con resolución judicial o en caso de flagrante delito."],["Reuniones en lugares de tránsito público (art. 21.2)","Comunicación previa a la autoridad; solo se pueden prohibir por razones fundadas de alteración del orden público con peligro para personas o bienes."],["Mayoría de edad (art. 12)","18 años."],["Derechos protegidos por recurso de amparo (art. 53.2)","Art. 14, arts. 15-29 y objeción de conciencia (art. 30)."],["Misión de las FCS (art. 104.1)","Proteger el libre ejercicio de los derechos y libertades y garantizar la seguridad ciudadana, bajo dependencia del Gobierno."],["Defensor del Pueblo (art. 54)","Alto comisionado de las Cortes Generales para la defensa de los derechos del Título I."]]},
{id:2,b:"Constitución",t:"Constitución Española (II): Corona, Cortes, Gobierno, Poder Judicial, TC y reforma",n:"CE 1978 · arts. 56-169",
r:["La Corona (Título II): el Rey es Jefe del Estado, símbolo de su unidad y permanencia. Su persona es inviolable y no está sujeta a responsabilidad; sus actos han de estar refrendados (por el Presidente del Gobierno, ministros o, en su caso, el Presidente del Congreso).",
"Las Cortes Generales (Título III) son bicamerales: Congreso (entre 300 y 400 diputados; actualmente 350) y Senado. Se eligen por cuatro años. Las leyes orgánicas requieren mayoría absoluta del Congreso en una votación final sobre el conjunto del proyecto.",
"El Gobierno (Título IV) dirige la política interior y exterior, la Administración civil y militar y la defensa del Estado. Los estados de alarma, excepción y sitio se regulan en el art. 116 y en la LO 4/1981.",
"El Poder Judicial (Título VI): la justicia emana del pueblo. El CGPJ lo forman el Presidente del Tribunal Supremo y 20 miembros por cinco años. El Tribunal Constitucional (Título IX) tiene 12 magistrados nombrados por el Rey por nueve años, renovados por terceras partes cada tres."],
c:[["Número de diputados según la CE (art. 68)","Mínimo 300 y máximo 400."],["Estado de alarma (art. 116.2)","Lo declara el Gobierno por decreto en Consejo de Ministros, máximo 15 días, dando cuenta al Congreso. Prórroga con autorización del Congreso."],["Estado de excepción (art. 116.3)","Lo declara el Gobierno previa autorización del Congreso; máximo 30 días, prorrogable por otro plazo igual."],["Estado de sitio (art. 116.4)","Lo declara el Congreso por mayoría absoluta, a propuesta exclusiva del Gobierno."],["Composición del Tribunal Constitucional (art. 159)","12 miembros, mandato de 9 años, renovación por terceras partes cada 3 años."],["Composición del CGPJ (art. 122.3)","Presidente del Tribunal Supremo + 20 miembros, por 5 años."],["Iniciativa legislativa popular (art. 87.3)","No menos de 500.000 firmas acreditadas."],["Aprobación de leyes orgánicas (art. 81.2)","Mayoría absoluta del Congreso en votación final sobre el conjunto."]]},
{id:3,b:"Aragón",t:"Organización territorial del Estado y Estatuto de Autonomía de Aragón",n:"CE Título VIII · LO 5/2007",
r:["El Estado se organiza territorialmente en municipios, provincias y Comunidades Autónomas (art. 137 CE), que gozan de autonomía para la gestión de sus intereses. El art. 148.1.22ª CE permite a las CCAA asumir la coordinación de las policías locales en los términos de una ley orgánica.",
"El Estatuto de Autonomía de Aragón vigente es la LO 5/2007, de 20 de abril, que reformó el Estatuto original (LO 8/1982, de 10 de agosto). Aragón se define como nacionalidad histórica. Su capital es Zaragoza; su bandera, las tradicionales cuatro barras rojas horizontales sobre fondo amarillo; el Día de Aragón es el 23 de abril.",
"Instituciones de la Comunidad Autónoma: las Cortes de Aragón, el Presidente, el Gobierno de Aragón y el Justicia de Aragón. Las Cortes tienen su sede en el Palacio de la Aljafería y actualmente las forman 67 diputados (Huesca 18, Teruel 14, Zaragoza 35).",
"Aragón se organiza territorialmente en municipios, comarcas y provincias. Tiene 731 municipios y 33 delimitaciones comarcales (Ley 10/1993, de Comarcalización de Aragón). El Justicia de Aragón protege los derechos individuales y colectivos, tutela el ordenamiento jurídico aragonés y defiende el Estatuto."],
c:[["Norma del Estatuto de Autonomía de Aragón vigente","LO 5/2007, de 20 de abril."],["Instituciones de Aragón","Cortes de Aragón, Presidente, Gobierno de Aragón y Justicia de Aragón."],["Día de Aragón","23 de abril (San Jorge)."],["Sede de las Cortes de Aragón","Palacio de la Aljafería (Zaragoza)."],["Organización territorial de Aragón","Municipios, comarcas y provincias."],["Número de municipios de Aragón","731."],["Diputados de las Cortes de Aragón","67: Zaragoza 35, Huesca 18, Teruel 14."],["Artículo de la CE sobre coordinación de policías locales por las CCAA","Art. 148.1.22ª."]]},
{id:4,b:"Régimen local",t:"Régimen Local: municipio, órganos y competencias (LBRL y Ley 7/1999 de Aragón)",n:"Ley 7/1985 · Ley 7/1999 Aragón",
r:["La Ley 7/1985, de 2 de abril, Reguladora de las Bases del Régimen Local (LBRL) define el municipio como entidad básica de la organización territorial del Estado. Sus elementos son el territorio, la población y la organización (art. 11.2).",
"Toda persona que viva en España debe inscribirse en el Padrón del municipio en que resida habitualmente (art. 15). Quien viva en varios municipios se inscribe solo en el que habite durante más tiempo al año.",
"Órganos: Alcalde, Tenientes de Alcalde y Pleno existen en todos los ayuntamientos; la Junta de Gobierno Local, en municipios de más de 5.000 habitantes y en los menores si lo dispone su reglamento orgánico o lo acuerda el Pleno (art. 20). El Alcalde ejerce la jefatura de la Policía Municipal (art. 21.1.i), dicta bandos y puede delegar algunas atribuciones.",
"Servicios mínimos (art. 26): en todos los municipios alumbrado público, cementerio, recogida de residuos, limpieza viaria, agua potable, alcantarillado, acceso a núcleos y pavimentación; en los de más de 5.000, además parque público, biblioteca y tratamiento de residuos; en los de más de 20.000, protección civil, servicios sociales, prevención y extinción de incendios e instalaciones deportivas; en los de más de 50.000, transporte colectivo urbano y medio ambiente urbano.",
"En Aragón rige además la Ley 7/1999, de 9 de abril, de Administración Local de Aragón, y la normativa de comarcalización."],
c:[["Elementos del municipio (art. 11.2 LBRL)","Territorio, población y organización."],["Órganos que existen en todos los ayuntamientos","Alcalde, Tenientes de Alcalde y Pleno."],["Junta de Gobierno Local obligatoria","Municipios de más de 5.000 habitantes."],["Quién ejerce la jefatura de la Policía Municipal","El Alcalde (art. 21.1.i LBRL)."],["Servicio mínimo de protección civil y extinción de incendios","Municipios de más de 20.000 habitantes."],["Transporte colectivo urbano de viajeros","Obligatorio en municipios de más de 50.000 habitantes."],["Ley de Administración Local de Aragón","Ley 7/1999, de 9 de abril."]]},
{id:5,b:"Régimen local",t:"Ordenanzas, bandos y potestad sancionadora municipal",n:"LBRL arts. 49, 139-141 · Ley 40/2015",
r:["Las ordenanzas y reglamentos municipales los aprueba el Pleno siguiendo el art. 49 LBRL: aprobación inicial, información pública y audiencia a los interesados durante al menos 30 días, resolución de reclamaciones y aprobación definitiva. Si no hay reclamaciones, el acuerdo inicial se entiende definitivo.",
"Entran en vigor tras publicarse íntegramente en el Boletín Oficial de la Provincia y transcurrir 15 días hábiles desde la recepción por las Administraciones del Estado y de la CA (arts. 65.2 y 70.2 LBRL). Los bandos los dicta el Alcalde.",
"El Título XI LBRL permite a las ordenanzas tipificar infracciones y sanciones en defecto de normativa sectorial (art. 139). Límites de multas (art. 141): muy graves hasta 3.000 €, graves hasta 1.500 € y leves hasta 750 €.",
"La Ley 40/2015 recoge los principios de la potestad sancionadora: legalidad, irretroactividad, tipicidad, responsabilidad, proporcionalidad, prescripción y concurrencia de sanciones (non bis in idem). Salvo ley especial, las infracciones muy graves prescriben a los 3 años, las graves a los 2 años y las leves a los 6 meses; las sanciones muy graves a los 3 años, las graves a los 2 y las leves al año."],
c:[["Límite de multa por infracción muy grave de ordenanza (art. 141 LBRL)","3.000 €."],["Límite de multa por infracción grave de ordenanza","1.500 €."],["Límite de multa por infracción leve de ordenanza","750 €."],["Información pública mínima de una ordenanza","30 días."],["Quién dicta los bandos","El Alcalde."],["Prescripción general de infracciones (Ley 40/2015)","Muy graves 3 años, graves 2 años, leves 6 meses."],["Principio non bis in idem","No se sanciona dos veces el mismo hecho con identidad de sujeto, hecho y fundamento."]]},
{id:6,b:"Administrativo",t:"Procedimiento administrativo común y régimen jurídico (Leyes 39/2015 y 40/2015)",n:"Ley 39/2015 · Ley 40/2015",
r:["La Ley 39/2015, de 1 de octubre, regula el Procedimiento Administrativo Común de las Administraciones Públicas; la Ley 40/2015, de 1 de octubre, el Régimen Jurídico del Sector Público.",
"Plazos: los señalados por días se entienden hábiles, excluidos sábados, domingos y festivos (art. 30.2). Si la norma no fija plazo para resolver, es de 3 meses (art. 21.3). En procedimientos iniciados a solicitud del interesado, el silencio es por regla general estimatorio (art. 24.1).",
"Los actos se presumen válidos y producen efectos desde que se dictan (art. 39). La notificación se cursa en el plazo de 10 días desde que se dicta el acto (art. 40.2). Son nulos de pleno derecho, entre otros, los actos que lesionen derechos susceptibles de amparo o dictados por órgano manifiestamente incompetente (art. 47); el resto de infracciones del ordenamiento causan anulabilidad (art. 48).",
"Recursos: alzada (1 mes si el acto es expreso; contra actos que no ponen fin a la vía administrativa), reposición potestativo (1 mes; contra actos que ponen fin a la vía) y extraordinario de revisión. La reclamación de responsabilidad patrimonial prescribe al año.",
"Para el policía es clave el art. 77.5: los hechos constatados por funcionarios con condición de autoridad, formalizados en documento público con los requisitos legales, hacen prueba salvo que se acredite lo contrario."],
c:[["Días hábiles en la Ley 39/2015","Se excluyen sábados, domingos y festivos."],["Plazo máximo para resolver si la norma no lo fija","3 meses."],["Silencio en procedimientos a solicitud del interesado (regla general)","Estimatorio (positivo)."],["Plazo del recurso de alzada contra acto expreso","1 mes."],["Plazo para cursar una notificación","10 días desde que se dicta el acto."],["Valor probatorio de lo constatado por agentes de la autoridad (art. 77.5)","Hace prueba salvo que se acredite lo contrario."],["Plazo para reclamar responsabilidad patrimonial","1 año."]]},
{id:7,b:"Administrativo",t:"Empleo público: TREBEP, derechos, deberes y régimen disciplinario",n:"RDL 5/2015",
r:["El Texto Refundido del Estatuto Básico del Empleado Público se aprobó por RDL 5/2015, de 30 de octubre. Clases de personal (art. 8): funcionarios de carrera, funcionarios interinos, personal laboral y personal eventual.",
"El ejercicio de funciones que impliquen participación directa o indirecta en las potestades públicas o en la salvaguarda de los intereses generales corresponde exclusivamente a funcionarios (art. 9.2). Por eso los policías locales son siempre funcionarios de carrera.",
"Grupos (art. 76): A (A1 y A2, título universitario), B (Técnico Superior) y C (C1: Bachiller o Técnico; C2: ESO). En Aragón, la categoría de Policía de la Policía Local está clasificada en el subgrupo C1.",
"Código de conducta: principios éticos (art. 53) y de conducta (art. 54). Situaciones administrativas (art. 85): servicio activo, servicios especiales, servicio en otras Administraciones, excedencia y suspensión de funciones.",
"Régimen disciplinario: faltas muy graves, graves y leves. Prescripción de faltas: muy graves 3 años, graves 2 años, leves 6 meses; sanciones: muy graves 3 años, graves 2 años, leves 1 año (art. 97). La suspensión firme de funciones no puede superar 6 años."],
c:[["Norma del Estatuto Básico del Empleado Público","RDL 5/2015, de 30 de octubre."],["Clases de empleados públicos","Funcionarios de carrera, interinos, personal laboral y eventual."],["Titulación del subgrupo C1","Bachiller o Técnico."],["Subgrupo de la categoría de Policía en Aragón","C1."],["Prescripción de las faltas (TREBEP)","Muy graves 3 años, graves 2 años, leves 6 meses."],["Duración máxima de la suspensión firme de funciones","6 años."],["Situaciones administrativas","Servicio activo, servicios especiales, servicio en otras AAPP, excedencia y suspensión de funciones."]]},
{id:8,b:"Policial",t:"Fuerzas y Cuerpos de Seguridad: LO 2/1986",n:"LO 2/1986, de 13 de marzo",
r:["La seguridad pública es competencia exclusiva del Estado; su mantenimiento corresponde al Gobierno. Las CCAA y las Corporaciones Locales participan en ella en los términos de la ley (art. 1). Son Fuerzas y Cuerpos de Seguridad: las FCSE (Policía Nacional y Guardia Civil), los cuerpos de policía de las CCAA y los de las Corporaciones Locales (art. 2).",
"Principios básicos de actuación (art. 5): adecuación al ordenamiento jurídico (neutralidad política, imparcialidad, integridad, sujeción a la jerarquía), relaciones con la comunidad (impedir prácticas abusivas, trato correcto, actuar con decisión y sin demora, usar las armas solo ante riesgo racionalmente grave para su vida o la de terceros, con congruencia, oportunidad y proporcionalidad), tratamiento de detenidos (identificarse, velar por su vida e integridad, cumplir plazos), dedicación profesional (intervenir siempre, de servicio o no), secreto profesional y responsabilidad personal y directa.",
"Los miembros de las FCS tienen a todos los efectos la consideración de agentes de la autoridad (art. 7). No pueden ejercer el derecho de huelga ni acciones sustitutivas.",
"Policías Locales (Título V): son institutos armados, de naturaleza civil, con estructura y organización jerarquizada (art. 52). Solo actúan en el ámbito territorial de su municipio, salvo situaciones de emergencia y previo requerimiento de las autoridades competentes (art. 51.3).",
"Funciones (art. 53.1): protección de autoridades locales y vigilancia de edificios municipales; ordenar, señalizar y dirigir el tráfico en el casco urbano; instruir atestados por accidentes de circulación en el casco urbano; policía administrativa (ordenanzas y bandos); participar en funciones de Policía Judicial; auxilio en accidentes, catástrofes y calamidades y ejecución de planes de protección civil; diligencias de prevención; vigilancia de espacios públicos y colaboración en manifestaciones y grandes concentraciones cuando sean requeridos; cooperar en la resolución de conflictos privados cuando sean requeridos.",
"Juntas Locales de Seguridad (art. 54): presididas por el Alcalde, salvo que asista el Delegado o Subdelegado del Gobierno, en cuyo caso la presidencia es compartida conforme a su reglamento."],
c:[["Naturaleza de los Cuerpos de Policía Local (art. 52)","Institutos armados de naturaleza civil, con estructura y organización jerarquizada."],["Ámbito de actuación de la Policía Local (art. 51.3)","Su término municipal, salvo emergencias y previo requerimiento de las autoridades competentes."],["Principios en el uso de armas (art. 5.2.c y d)","Congruencia, oportunidad y proporcionalidad; solo ante riesgo racionalmente grave para su vida, integridad o la de terceros, o grave riesgo para la seguridad ciudadana."],["Consideración legal de los miembros de las FCS (art. 7)","Agentes de la autoridad."],["Derecho de huelga de los policías","No pueden ejercerlo ni realizar acciones sustitutivas."],["Atestados por accidentes de tráfico que instruye la Policía Local","Los ocurridos dentro del casco urbano."],["Quién preside la Junta Local de Seguridad","El Alcalde."],["Dedicación profesional (art. 5.4)","Intervenir siempre, en cualquier tiempo y lugar, de servicio o no, en defensa de la ley y la seguridad ciudadana."]]},
{id:9,b:"Aragón",t:"Coordinación de Policías Locales de Aragón (Ley 8/2013)",n:"Ley 8/2013, de 12 de septiembre",
r:["La Comunidad Autónoma coordina la actuación de las policías locales de su territorio (art. 148.1.22ª CE, art. 39 LO 2/1986 y Estatuto de Aragón). La coordinación incluye fijar normas marco, homogeneizar medios técnicos, uniformidad y retribuciones básicas, establecer criterios de selección, formación, promoción y movilidad y coordinar la formación.",
"La norma vigente es la Ley 8/2013, de 12 de septiembre, de Coordinación de Policías Locales de Aragón, que sustituyó a la anterior regulación autonómica. Se completa con reglamentos y normas marco aprobados por el Gobierno de Aragón; consulta siempre su texto consolidado en el BOA y en las bases de tu convocatoria.",
"Puntos que conviene dominar de la ley: ámbito de aplicación y definición de los cuerpos; funciones; estructura en escalas y categorías y su clasificación (la categoría de Policía se integra en el subgrupo C1); requisitos de ingreso; sistema de acceso (oposición libre, curso selectivo de formación y periodo de prácticas); segunda actividad; uniformidad, acreditación y armamento; derechos y deberes; régimen disciplinario; órgano autonómico de coordinación y registro de policías locales.",
"En los municipios sin cuerpo de Policía Local las funciones de custodia y vigilancia pueden ejercerlas auxiliares o vigilantes conforme a la ley. Municipios limítrofes de la misma comunidad que no dispongan por separado de recursos suficientes pueden asociarse para prestar el servicio de policía local (DA 5ª LO 2/1986), con autorización del Ministerio del Interior."],
c:[["Ley de coordinación de policías locales de Aragón","Ley 8/2013, de 12 de septiembre."],["Fases habituales de acceso a la categoría de Policía","Oposición libre, curso selectivo de formación y periodo de prácticas."],["Subgrupo de clasificación de la categoría de Policía en Aragón","C1."],["Asociación de municipios para prestar servicio de policía local","DA 5ª LO 2/1986: municipios limítrofes de la misma CA sin recursos suficientes por separado, con autorización del Ministerio del Interior."],["Funciones de la coordinación autonómica","Normas marco, homogeneización de medios y uniformidad, criterios de selección, formación, promoción y movilidad."]]},
{id:10,b:"Penal",t:"Derecho Penal: parte general",n:"LO 10/1995 · Código Penal",
r:["Son delitos las acciones y omisiones dolosas o imprudentes penadas por la ley (art. 10 CP). Las acciones imprudentes solo se castigan cuando la ley lo dispone expresamente (art. 12). Los delitos se clasifican en graves, menos graves y leves según su pena (art. 13).",
"Son punibles el delito consumado y la tentativa (art. 15). Son responsables criminalmente los autores (incluidos inductores y cooperadores necesarios) y los cómplices (arts. 27-29). Los menores de 18 años no son responsables con arreglo al CP; responden conforme a la LO 5/2000 si tienen 14 años o más.",
"Eximentes (art. 20): anomalía o alteración psíquica, intoxicación plena, alteraciones en la percepción, legítima defensa (agresión ilegítima, necesidad racional del medio empleado y falta de provocación suficiente), estado de necesidad, miedo insuperable y obrar en cumplimiento de un deber o en el ejercicio legítimo de un derecho, oficio o cargo.",
"Agravantes (art. 22): alevosía; disfraz, abuso de superioridad o aprovechamiento de circunstancias; precio, recompensa o promesa; motivos racistas, discriminatorios o de género; ensañamiento; abuso de confianza; prevalerse del carácter público; reincidencia.",
"Penas graves: prisión superior a 5 años, entre otras. Menos graves: prisión de 3 meses a 5 años. La prisión permanente revisable es pena grave."],
c:[["Definición de delito (art. 10 CP)","Acciones y omisiones dolosas o imprudentes penadas por la ley."],["Requisitos de la legítima defensa","Agresión ilegítima, necesidad racional del medio empleado y falta de provocación suficiente del defensor."],["Edad de responsabilidad penal de menores (LO 5/2000)","De 14 a 17 años; los menores de 14 no responden penalmente."],["Clasificación de los delitos (art. 13)","Graves, menos graves y leves."],["Prisión como pena menos grave","De 3 meses a 5 años."],["Eximente aplicable al policía que actúa conforme a la ley","Cumplimiento de un deber o ejercicio legítimo de un oficio o cargo (art. 20.7)."]]},
{id:11,b:"Penal",t:"Delitos de especial interés policial",n:"CP · Libros II",
r:["Contra la vida e integridad: homicidio (art. 138, prisión de 10 a 15 años), asesinato (art. 139, de 15 a 25 años, con alevosía, precio o ensañamiento, o para facilitar otro delito o evitar que se descubra), lesiones (art. 147: requieren objetivamente tratamiento médico o quirúrgico además de la primera asistencia).",
"Contra el patrimonio: hurto (art. 234: tomar cosas muebles ajenas sin la voluntad de su dueño con ánimo de lucro; delito leve si lo sustraído no excede de 400 €, salvo agravantes o reiteración), robo (art. 237: con fuerza en las cosas o violencia o intimidación en las personas), robo y hurto de uso de vehículos (art. 244), usurpación (art. 245), daños (art. 263).",
"Contra la seguridad vial: conducir con exceso de velocidad de 60 km/h en vía urbana u 80 km/h en interurbana sobre el límite, o bajo influencia de alcohol o drogas; en todo caso con tasa superior a 0,60 mg/l en aire espirado o 1,2 g/l en sangre (art. 379); conducción temeraria (art. 380); negativa a someterse a las pruebas (art. 383, prisión de 6 meses a 1 año); conducir sin permiso por pérdida de puntos, privación judicial o sin haberlo obtenido nunca (art. 384).",
"Contra el orden público: atentado contra la autoridad, sus agentes o funcionarios (art. 550: agredir, acometer con violencia o intimidación grave u oponer resistencia grave con violencia); resistencia y desobediencia graves (art. 556.1); falta de respeto y consideración debida a la autoridad (art. 556.2, delito leve).",
"Otros: omisión del deber de socorro (art. 195), allanamiento de morada (art. 202), violencia doméstica y de género (arts. 153 y 173.2), amenazas (art. 169) y coacciones (art. 172)."],
c:[["Umbral del hurto como delito leve (art. 234.2)","Hasta 400 €."],["Diferencia entre hurto y robo","El robo exige fuerza en las cosas o violencia o intimidación en las personas."],["Tasa de alcohol que es delito en todo caso (art. 379.2)","Más de 0,60 mg/l en aire espirado o 1,2 g/l en sangre."],["Exceso de velocidad constitutivo de delito","Más de 60 km/h sobre el límite en urbana u 80 km/h en interurbana."],["Pena por negarse a las pruebas de alcohol y drogas (art. 383)","Prisión de 6 meses a 1 año y privación del permiso de 1 a 4 años."],["Pena del homicidio (art. 138)","Prisión de 10 a 15 años."],["Delito de atentado","Art. 550 CP: agredir o acometer a la autoridad o sus agentes, o resistencia grave con violencia."]]},
{id:12,b:"Penal",t:"Policía Judicial, detención, derechos del detenido y habeas corpus",n:"LECrim · LO 6/1984 · LO 5/2000",
r:["La Policía Judicial averigua los delitos públicos, practica las diligencias necesarias para comprobarlos y descubrir a los delincuentes y asegura los efectos e instrumentos del delito, poniéndolos a disposición judicial (art. 282 LECrim). Las Policías Locales participan en estas funciones como colaboradoras.",
"Cualquier persona puede detener en los casos del art. 490 (quien intente cometer un delito en el momento de ir a cometerlo, el delincuente in fraganti, el fugado, etc.). Los agentes de la Policía Judicial tienen además la obligación de detener en los supuestos del art. 492. Por delito leve no se puede detener, salvo que el presunto autor no tenga domicilio conocido ni dé fianza bastante (art. 495).",
"Derechos del detenido (art. 520): ser informado por escrito, en lenguaje sencillo y accesible, de los hechos, de las razones de la detención y de sus derechos; guardar silencio y no declarar contra sí mismo ni confesarse culpable; designar abogado y ser asistido por él (el abogado debe acudir en un máximo de 3 horas); acceso a los elementos de las actuaciones esenciales para impugnar la detención; comunicar la detención a un familiar o persona que desee; comunicarse con un tercero; asistencia consular si es extranjero; intérprete gratuito; reconocimiento médico.",
"La detención durará el tiempo estrictamente necesario y como máximo 72 horas. Habeas corpus (LO 6/1984): lo resuelve el Juez de Instrucción del lugar donde se encuentre la persona privada de libertad, en el plazo de 24 horas.",
"Menores (LO 5/2000): la detención de un menor se comunica inmediatamente al Ministerio Fiscal y a sus representantes legales; en el plazo máximo de 24 horas debe quedar en libertad o a disposición del Fiscal. Los menores de 14 años se entregan a sus representantes legales y se da cuenta a la entidad de protección y al Fiscal.",
"El atestado tiene el valor de denuncia a efectos legales (art. 297 LECrim)."],
c:[["Plazo máximo de la detención preventiva","72 horas."],["Plazo máximo para que el abogado acuda","3 horas desde la recepción del encargo."],["Plazo del juez para resolver el habeas corpus","24 horas."],["Juez competente del habeas corpus","Juez de Instrucción del lugar donde se encuentre la persona privada de libertad."],["Detención de menor: plazo máximo","24 horas para ponerlo en libertad o a disposición del Ministerio Fiscal."],["Valor del atestado (art. 297 LECrim)","Valor de denuncia."],["¿Se puede detener por un delito leve?","No, salvo que no tenga domicilio conocido ni dé fianza bastante (art. 495)."]]},
{id:13,b:"Policial",t:"Protección de la Seguridad Ciudadana (LO 4/2015)",n:"LO 4/2015, de 30 de marzo",
r:["La LO 4/2015 regula la documentación e identificación personal, las actuaciones para el mantenimiento y restablecimiento de la seguridad ciudadana y el régimen sancionador.",
"El DNI es obligatorio desde los 14 años (art. 9). Los agentes pueden requerir la identificación para prevenir delitos o sancionar infracciones, o cuando haya indicios de participación en una infracción (art. 16). Si no es posible identificar a la persona, pueden requerirle que les acompañe a dependencias cercanas para la identificación, por el tiempo imprescindible y nunca más de 6 horas, informándole de forma inmediata y comprensible de las razones.",
"Entrada y registro en domicilio (art. 15): solo con consentimiento del titular, resolución judicial o en caso de flagrante delito; también para evitar daños inminentes y graves a personas o cosas en catástrofe, calamidad, ruina inminente u otros supuestos de extrema y urgente necesidad. Registros corporales externos (art. 20): por agente del mismo sexo y, si exige dejar a la vista partes del cuerpo, en lugar reservado.",
"Infracciones y sanciones (art. 39): leves de 100 a 600 €; graves de 601 a 30.000 €; muy graves de 30.001 a 600.000 €. Son graves, entre otras, la desobediencia o resistencia a la autoridad no constitutivas de delito (art. 36.6), el consumo o tenencia ilícitos de drogas en lugares públicos (art. 36.16) y el uso no autorizado de imágenes de agentes que ponga en peligro su seguridad o la de la operación (art. 36.23). Son leves las faltas de respeto y consideración a los agentes (art. 37.4).",
"Prescripción de infracciones (art. 38): leves 6 meses, graves 1 año, muy graves 2 años."],
c:[["Edad desde la que el DNI es obligatorio","14 años."],["Tiempo máximo en dependencias para identificar a alguien","6 horas."],["Multa por infracción leve LO 4/2015","De 100 a 600 €."],["Multa por infracción grave LO 4/2015","De 601 a 30.000 €."],["Multa por infracción muy grave LO 4/2015","De 30.001 a 600.000 €."],["Consumo de drogas en la vía pública","Infracción grave (art. 36.16)."],["Faltas de respeto a los agentes","Infracción leve (art. 37.4)."],["Prescripción de infracciones LO 4/2015","Leves 6 meses, graves 1 año, muy graves 2 años."]]},
{id:14,b:"Tráfico",t:"Tráfico y Seguridad Vial (I): Ley, competencias municipales, sanciones y puntos",n:"RDL 6/2015 · LSV",
r:["El Texto Refundido de la Ley sobre Tráfico, Circulación de Vehículos a Motor y Seguridad Vial se aprobó por RDL 6/2015, de 30 de octubre. Los municipios son competentes (art. 7) para la ordenación y control del tráfico en las vías urbanas de su titularidad, su vigilancia por agentes propios, la denuncia y sanción de las infracciones cometidas en ellas, la regulación mediante ordenanza de usos (aparcamiento, peatones, carga y descarga), la retirada e inmovilización de vehículos y la realización de pruebas de alcohol y drogas.",
"Infracciones: leves, graves y muy graves (arts. 75-77). Multas (art. 80): leves hasta 100 €, graves 200 € y muy graves 500 €, con excepciones (por ejemplo, alcohol y velocidad tienen cuantías específicas). El pago voluntario en los 20 días naturales siguientes a la notificación reduce la multa un 50% (procedimiento abreviado, art. 94).",
"Prescripción de infracciones (art. 112): leves 3 meses; graves y muy graves 6 meses. Las sanciones prescriben a los 4 años.",
"Permiso por puntos: 12 puntos iniciales (8 para conductores noveles con menos de 3 años de antigüedad, salvo que ya tuvieran otro permiso). Detraen 6 puntos, entre otros, conducir con tasa de alcohol superior a 0,50 mg/l en aire (o positiva en drogas) y usar el teléfono móvil sujetándolo con la mano; detraen 4 puntos no usar el cinturón, casco o sistemas de retención infantil.",
"Medidas provisionales: inmovilización del vehículo (art. 104), retirada y depósito (art. 105, por ejemplo cuando obstaculiza gravemente la circulación o permanece estacionado en lugares habilitados como de uso exclusivo) y tratamiento residual (art. 106)."],
c:[["Norma básica de tráfico","RDL 6/2015, de 30 de octubre (Texto Refundido de la LSV)."],["Cuantía de las multas leves, graves y muy graves (art. 80)","Hasta 100 €, 200 € y 500 €."],["Reducción por pronto pago","50% si se paga en 20 días naturales."],["Prescripción de infracciones de tráfico","Leves 3 meses; graves y muy graves 6 meses."],["Saldo inicial de puntos","12 puntos (8 para noveles)."],["Puntos por usar el móvil sujetándolo con la mano","6 puntos."],["Puntos por no usar el cinturón de seguridad","4 puntos."],["Retirada de vehículos","Art. 105 LSV."]]},
{id:15,b:"Tráfico",t:"Tráfico y Seguridad Vial (II): Reglamento General de Circulación, alcoholemia y accidentes",n:"RD 1428/2003 · RD 970/2020",
r:["Velocidades en vía urbana (art. 50 RGC, tras el RD 970/2020): 20 km/h en vías de plataforma única de calzada y acera; 30 km/h en vías de un único carril por sentido; 50 km/h en vías de dos o más carriles por sentido. Los ayuntamientos pueden rebajarlas mediante señalización.",
"Tasas de alcohol (art. 20 RGC): con carácter general, 0,5 g/l en sangre o 0,25 mg/l en aire espirado; para conductores profesionales y noveles (menos de dos años de permiso), 0,3 g/l en sangre o 0,15 mg/l en aire. Están obligados a someterse a las pruebas todos los conductores; también los usuarios implicados en un accidente.",
"Si la primera prueba es positiva, se realiza una segunda con un intervalo mínimo de 10 minutos, y el interesado puede pedir un análisis de sangre de contraste.",
"Orden de prioridad de las señales (art. 133 RGC): 1º señales y órdenes de los agentes; 2º señales circunstanciales que modifican el régimen normal de la vía y de balizamiento; 3º semáforos; 4º señales verticales; 5º marcas viales.",
"Sistemas de retención infantil: los menores de estatura igual o inferior a 135 cm deben usar un SRI homologado adaptado a su talla y peso. El permiso de ciclomotor (AM) puede obtenerse a los 15 años y el B a los 18.",
"Ante un accidente: proteger (señalizar y asegurar la zona), avisar (112) y socorrer; preservar indicios; identificar implicados y testigos; realizar pruebas de alcohol y drogas; levantar croquis, reportaje fotográfico y, si procede, atestado."],
c:[["Velocidad en vía urbana de un carril por sentido","30 km/h."],["Velocidad en vía de plataforma única","20 km/h."],["Tasa general de alcohol en aire espirado","0,25 mg/l (0,5 g/l en sangre)."],["Tasa para noveles y profesionales en aire espirado","0,15 mg/l (0,3 g/l en sangre)."],["Intervalo mínimo entre las dos pruebas de alcoholemia","10 minutos."],["Orden de prioridad de las señales","Agentes > circunstanciales y balizamiento > semáforos > verticales > marcas viales."],["Estatura hasta la que es obligatorio el SRI","135 cm."],["Secuencia ante un accidente","PAS: Proteger, Avisar (112) y Socorrer."]]},
{id:16,b:"Social",t:"Violencia de género, igualdad y protección de menores",n:"LO 1/2004 · LO 3/2007 · LO 8/2021 · Ley 4/2007 Aragón",
r:["La LO 1/2004, de 28 de diciembre, de Medidas de Protección Integral contra la Violencia de Género, actúa contra la violencia que se ejerce sobre las mujeres por quienes sean o hayan sido sus cónyuges o estén o hayan estado ligados a ellas por relaciones similares de afectividad, aun sin convivencia. Creó los Juzgados de Violencia sobre la Mujer.",
"La orden de protección (art. 544 ter LECrim) la dicta el juez y unifica medidas penales y civiles. El sistema VioGén del Ministerio del Interior permite valorar el riesgo y hacer el seguimiento de las víctimas; las policías locales pueden integrarse mediante convenio. El teléfono 016 atiende a víctimas y no deja rastro en la factura.",
"La LO 3/2007, de 22 de marzo, para la igualdad efectiva de mujeres y hombres, define la discriminación directa e indirecta, el acoso sexual y el acoso por razón de sexo. La LO 10/2022 de garantía integral de la libertad sexual y la LO 8/2021 de protección integral a la infancia y la adolescencia frente a la violencia (LOPIVI) completan el marco.",
"En Aragón, la Ley 4/2007, de 22 de marzo, de Prevención y Protección Integral a las Mujeres Víctimas de Violencia en Aragón.",
"Actuación policial: atender a la víctima de forma prioritaria, protegerla y separarla del agresor, procurar asistencia sanitaria, informar de sus derechos, detener al presunto agresor si procede, recoger pruebas y testigos y comunicar al juzgado de guardia."],
c:[["Ley integral de violencia de género","LO 1/2004, de 28 de diciembre."],["Teléfono de atención a víctimas de violencia de género","016 (no deja rastro en la factura)."],["Precepto que regula la orden de protección","Art. 544 ter LECrim."],["Ley de igualdad efectiva de mujeres y hombres","LO 3/2007, de 22 de marzo."],["Ley aragonesa de violencia sobre la mujer","Ley 4/2007, de 22 de marzo."],["Sistema de seguimiento integral de casos de violencia de género","VioGén (Ministerio del Interior)."]]},
{id:17,b:"Policial",t:"Protección civil, emergencias y espectáculos públicos en Aragón",n:"Ley 17/2015 · Ley 30/2002 Aragón · Ley 11/2005 Aragón",
r:["La Ley 17/2015, de 9 de julio, regula el Sistema Nacional de Protección Civil. En Aragón rige la Ley 30/2002, de 17 de diciembre, de Protección Civil y Atención de Emergencias de Aragón. El teléfono único de emergencias es el 112 (SOS Aragón).",
"Instrumentos: plan territorial de la comunidad (PLATEAR), planes especiales (inundaciones, incendios forestales, riesgo químico, etc.), planes municipales y planes de autoprotección de centros y actividades.",
"Las Policías Locales prestan auxilio en accidentes, catástrofes y calamidades y participan en la ejecución de los planes de protección civil (art. 53.1.f LO 2/1986). El Alcalde es la autoridad municipal de protección civil.",
"Espectáculos públicos: la Ley 11/2005, de 28 de diciembre, de Espectáculos Públicos, Actividades Recreativas y Establecimientos Públicos de la Comunidad Autónoma de Aragón regula horarios, aforos, licencias, condiciones de seguridad e inspección, y el régimen sancionador. La Policía Local inspecciona establecimientos, controla horarios de cierre y aforos y denuncia las infracciones."],
c:[["Ley estatal de protección civil","Ley 17/2015, de 9 de julio."],["Ley aragonesa de protección civil","Ley 30/2002, de 17 de diciembre."],["Teléfono único de emergencias","112."],["Ley de espectáculos públicos de Aragón","Ley 11/2005, de 28 de diciembre."],["Autoridad municipal de protección civil","El Alcalde."]]},
{id:18,b:"Policial",t:"Deontología policial, derechos humanos y policía de proximidad",n:"ONU 1979 · Consejo de Europa 1979 y 2001",
r:["Textos internacionales: la Declaración Universal de Derechos Humanos (10 de diciembre de 1948); el Convenio Europeo de Derechos Humanos (Roma, 1950); el Código de Conducta de la ONU para funcionarios encargados de hacer cumplir la ley (Resolución 34/169, de 17 de diciembre de 1979); la Declaración sobre la Policía del Consejo de Europa (Resolución 690, de 1979); y el Código Europeo de Ética de la Policía (Recomendación Rec(2001)10).",
"El uso de la fuerza debe ser excepcional, en la medida estrictamente necesaria y regido por los principios de congruencia, oportunidad y proporcionalidad (art. 5 LO 2/1986). Ningún agente puede infligir, instigar o tolerar actos de tortura o tratos crueles, inhumanos o degradantes, ni invocar la orden de un superior para justificarlos.",
"La policía de proximidad o comunitaria se basa en el conocimiento del barrio, la prevención, la mediación, la colaboración con vecinos y servicios sociales y la resolución de problemas antes de que se conviertan en delitos. Encaja con la función de la Policía Local de cooperar en la resolución de conflictos privados cuando sea requerida.",
"Atención al ciudadano: trato correcto y esmerado, identificación profesional, información clara, atención a colectivos vulnerables y respeto a la diversidad."],
c:[["Código de conducta de la ONU para funcionarios encargados de hacer cumplir la ley","Resolución 34/169, de 17 de diciembre de 1979."],["Declaración sobre la Policía del Consejo de Europa","Resolución 690 de 1979."],["Código Europeo de Ética de la Policía","Recomendación Rec(2001)10 del Comité de Ministros."],["Fecha de la Declaración Universal de Derechos Humanos","10 de diciembre de 1948."],["¿Exime la orden de un superior de responsabilidad por tortura?","No. Nunca puede invocarse."]]},
{id:19,b:"Social",t:"Extranjería, protección de datos y transparencia",n:"LO 4/2000 · LO 3/2018 · RGPD · Ley 8/2015 Aragón",
r:["La LO 4/2000, de 11 de enero, regula los derechos y libertades de los extranjeros en España y su integración social. Los extranjeros tienen derecho y deber de conservar su documentación (pasaporte o documento de identidad y, en su caso, tarjeta de identidad de extranjero) y exhibirla cuando se la requieran los agentes.",
"La competencia en materia de extranjería corresponde al Estado; la Policía Local actúa en colaboración, comunicando hechos al Cuerpo Nacional de Policía y garantizando los derechos de las personas, en especial de menores extranjeros no acompañados, que se ponen a disposición de los servicios de protección y del Ministerio Fiscal.",
"Protección de datos: el Reglamento (UE) 2016/679 (RGPD) y la LO 3/2018, de 5 de diciembre, de Protección de Datos Personales y garantía de los derechos digitales. Los datos tratados con fines policiales de prevención, investigación y enjuiciamiento de infracciones penales se rigen por la LO 7/2021. La videovigilancia policial en lugares públicos tiene su normativa específica.",

{t:"Accidente con heridos en el casco urbano",tag:"Tráfico",e:"A las 19:40 un turismo y una motocicleta colisionan en una intersección regulada por semáforo. El motorista está en el suelo, consciente, con dolor en una pierna. El conductor del turismo dice que el semáforo estaba en ámbar.",p:["¿Qué haces al llegar y en qué orden?","¿A quién haces las pruebas de alcohol y drogas?","¿Qué documentación debes elaborar?"],s:"1) Proteger: situar el vehículo policial y señalizar para evitar un segundo accidente; Avisar: 112 (sanitarios); Socorrer: no mover al herido salvo peligro, no quitar el casco salvo necesidad vital. 2) Pruebas de alcohol y drogas a ambos conductores: están obligados los conductores y usuarios implicados en un accidente (arts. 21 y 28 RGC). 3) Identificar a implicados y testigos, recoger documentación de vehículos y seguros, croquis, fotografías y posición final de vehículos y vestigios. 4) Con heridos, atestado (accidente dentro del casco urbano: competencia de la Policía Local, art. 53.1.c LO 2/1986) y comunicación al juzgado si los hechos pueden ser delito. 5) Restablecer la circulación y retirar vehículos y restos."},
{t:"Conductor con 0,72 mg/l",tag:"Penal / Tráfico",e:"En un control preventivo un conductor da 0,74 mg/l en la primera prueba y 0,72 mg/l en la segunda, a los 12 minutos. Está tranquilo y colabora.",p:["¿Es infracción administrativa o delito?","¿Qué medidas adoptas con el vehículo?","¿Cómo continúa el procedimiento?"],s:"1) Es delito del art. 379.2 CP: más de 0,60 mg/l en aire espirado (se toma la segunda prueba, la de menor resultado). 2) Informar del derecho al análisis de sangre de contraste. 3) Inmovilizar el vehículo (art. 104 LSV) salvo que otro conductor habilitado se haga cargo. 4) Instruir diligencias como investigado no detenido (con los derechos del art. 118 LECrim) o detenido si procede, citándolo ante el juzgado de guardia para juicio rápido (art. 795 LECrim). 5) Acta de signos externos, certificado del etilómetro y verificación metrológica."},
{t:"Hurto en un supermercado",tag:"Penal",e:"El vigilante de seguridad de un supermercado retiene a una persona que ha intentado salir sin pagar productos por valor de 85 €. La persona tiene DNI y domicilio conocido. No hay violencia.",p:["¿Qué tipo penal es?","¿Procede la detención?","¿Qué diligencias practicas?"],s:"1) Delito leve de hurto (art. 234.2 CP), salvo reiteración o agravantes. En grado de tentativa si no llegó a disponer de los efectos. 2) No procede la detención: por delito leve solo se detiene si no tiene domicilio conocido ni da fianza bastante (art. 495 LECrim). 3) Identificar al autor, recoger la denuncia del establecimiento, la valoración y los tickets, devolver los efectos al perjudicado, tomar declaración al vigilante como testigo, comprobar antecedentes de reiteración y remitir las diligencias al juzgado."},
{t:"Aviso por violencia de género en un domicilio",tag:"Violencia de género",e:"Una vecina llama porque oye gritos de auxilio de una mujer y golpes en el piso de al lado. Al llegar, un hombre abre la puerta y dice que todo está bien y que os vayáis.",p:["¿Puedes entrar en el domicilio?","¿Cómo actúas con la víctima y con el presunto agresor?","¿Qué comunicaciones debes hacer?"],s:"1) Sí: hay indicios de delito flagrante y de riesgo para la integridad de una persona; la entrada está amparada en el art. 18.2 CE y el art. 15 LO 4/2015. 2) Separar a las partes, asegurar a la víctima, solicitar asistencia sanitaria si hay lesiones, atender a menores presentes. 3) Detener al presunto agresor si hay indicios de delito (arts. 153 o 173.2 CP), informándole de sus derechos (art. 520 LECrim). 4) Informar a la víctima de sus derechos y de la posibilidad de pedir orden de protección (art. 544 ter LECrim); 016. 5) Recoger testimonio de la vecina, inspección ocular y fotografías. 6) Atestado al juzgado de guardia o de Violencia sobre la Mujer, valoración de riesgo VioGén (o comunicación a FCSE si el cuerpo no está integrado)."},
{t:"Menores con una mochila robada",tag:"Menores",e:"Localizáis a dos chicos con una mochila que acaba de ser sustraída con un tirón a una mujer, que se cayó al suelo. Uno tiene 13 años y el otro 16.",p:["¿Qué tratamiento das a cada uno?","¿Qué plazos debes respetar?"],s:"1) El tirón con caída de la víctima puede ser robo con violencia (art. 237 CP). 2) Menor de 16 años: detención conforme a la LO 5/2000, comunicando de inmediato al Ministerio Fiscal y a sus representantes legales; en un máximo de 24 horas, libertad o a disposición del Fiscal. Asistencia letrada y dependencias separadas de adultos. 3) Menor de 13 años: no es responsable (art. 3 LO 5/2000); se le entrega a sus representantes legales y se da cuenta al Fiscal de Menores y a la entidad de protección. 4) Devolver la mochila, asistencia a la víctima, testigos y atestado."},
{t:"Botellón y ruidos de madrugada",tag:"Ordenanzas / LO 4/2015",e:"A las 3:00, en un parque, un grupo de 15 jóvenes bebe alcohol con música alta. Algunos vecinos se quejan. Ves a uno de ellos fumando un porro.",p:["¿Qué normas aplicas?","¿Cómo actúas?"],s:"1) Consumo de alcohol en vía pública y ruidos: ordenanzas municipales de convivencia y ruidos (infracciones con los límites del art. 141 LBRL si la ordenanza no fija otros). 2) Consumo de drogas en lugar público: infracción grave del art. 36.16 LO 4/2015, con intervención de la sustancia y acta. 3) Actuación proporcionada: presencia, mediación y requerimiento de cese de la música y de la actividad; identificación de los infractores (art. 16 LO 4/2015) y denuncias. 4) Si hay menores con alcohol, comunicación a sus padres y aplicación de la normativa de protección de menores. 5) Si desobedecen gravemente, art. 36.6 LO 4/2015 o, si es delito, art. 556 CP."},
{t:"Persona que se niega a identificarse",tag:"Seguridad ciudadana",e:"Tras un altercado en un bar, un testigo os señala a un hombre como autor de un golpe a otro cliente. El hombre no lleva documentación y se niega a dar sus datos.",p:["¿Puedes trasladarlo a dependencias?","¿Durante cuánto tiempo?","¿Qué otras responsabilidades puede tener?"],s:"1) Sí: existen indicios de participación en una infracción y no es posible identificarlo en el lugar (art. 16.2 LO 4/2015). 2) Se le informa de forma inmediata y comprensible de las razones; la diligencia dura el tiempo imprescindible y nunca más de 6 horas, y se anota en el libro-registro. 3) Negarse a identificarse puede ser infracción grave (art. 36.6) o, si persiste de forma grave, delito de desobediencia (art. 556 CP). 4) Si hay lesiones, diligencias por delito de lesiones o leve de lesiones, según el resultado."},
{t:"Vehículo bloqueando un vado y una salida de emergencia",tag:"Tráfico",e:"Un turismo está estacionado ante un vado permanente señalizado que es también la salida de ambulancias de un centro de salud. No hay nadie en el vehículo.",p:["¿Puedes retirar el vehículo?","¿Qué infracción denuncias?","¿Quién paga la grúa?"],s:"1) Sí: la Administración puede retirar el vehículo cuando obstaculiza gravemente la circulación o el funcionamiento de un servicio público, o está en lugar señalizado como de uso exclusivo (art. 105 LSV). 2) Denuncia por estacionamiento prohibido conforme al RGC y la ordenanza municipal; si obstaculiza gravemente, puede ser grave. 3) Los gastos de retirada y depósito los paga el titular, salvo sustracción u otros supuestos legales. 4) Fotografías y reflejo en el boletín de denuncia."},
{t:"Manifestación no comunicada",tag:"Derechos fundamentales",e:"Unas 40 personas cortan pacíficamente una calle principal para protestar por el cierre de un centro escolar. No consta comunicación previa a la Delegación del Gobierno.",p:["¿Es ilegal la concentración?","¿Cómo actúas?"],s:"1) El derecho de reunión (art. 21 CE) no exige autorización, solo comunicación previa. La falta de comunicación no la convierte en delictiva, pero puede ser infracción leve del promotor (art. 37.1 LO 4/2015). 2) Informar a la Delegación o Subdelegación del Gobierno, que es la autoridad competente. 3) Garantizar la seguridad, desviar el tráfico, mediar con los responsables y proteger a los asistentes y a terceros. 4) La disolución solo procede en los supuestos del art. 23 LO 4/2015 y con criterios de proporcionalidad, avisando previamente."}
];
