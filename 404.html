   <p class="small muted">Lo que va primero recibe más sesiones.</p></div></section>
 <section class="panel stack"><div class="eyebrow">Esta semana</div><div class="week">${sem.map(d=>`<div class="wd ${d===wd?"cur":""}"><b>${DIAS[d].slice(0,3)}</b><span>${map[d]?esc(FAMN[map[d]]):"Descanso"}</span></div>`).join("")}</div>
  <details class="case"><summary><b>Ver todas las sesiones de la semana</b></summary><div class="in">${sem.filter(d=>map[d]).map(d=>{const s=sesion(map[d]);return `<div class="stack" style="gap:4px"><b>${DIAS[d]}: ${esc(s.t)}</b><ul class="clean small">${s.b.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>`}).join("")}</div></details></section>
 <section class="panel"><p class="small muted">Si tienes dolor, lesiones o alguna duda de salud, consulta antes con un médico o un preparador físico. Recuerda que para el día de las pruebas necesitarás un certificado médico.</p></section>`}
function resumenEntreno(){const g=famGaps();return{fase:faseEnt(),diasSemana:trainDays().length,prioridades:famOrden().map(f=>({familia:f,falta:g[f].sin?null:Math.round(g[f].g*100)})),hechas28:Object.keys(entInicio().hechas||{}).filter(d=>new Date(d).getTime()>Date.now()-28*DAY).length}}

/* ================= PLAN DEL DÍA ================= */
function dayPlan(){
 const g=GOALS[S.goal]||GOALS.normal,wd=new Date().getDay(),f=faseActual(),t=temaActual(),dl=daysLeft();
 const final=!S.exampleDate&&dl!=null&&dl>=0&&dl<=21;
 const tt=t?"el tema "+t.id:"tus temas flojos";
 const X=(k,n,txt,min,act,sub)=>({k,n,t:txt,min,act,sub:sub||""});
 let tasks=[],no=[],foco="";
 if(final){foco="Recta final: repasar, no aprender cosas nuevas";tasks=[X("fal",Math.min(20,g.q),"Repasa preguntas falladas",15,"falladas"),X("c",g.c,"Repasa las tarjetas pendientes",10,"tarjetas"),wd%2?X("sim",1,"Medio simulacro (50 preguntas, 1 h)",60,"sim50"):X("psico",1,"Un bloque de psicotécnicos",5,"psico")];no=["No empieces temas nuevos.","No trasnoches: el sueño fija lo estudiado.","No entrenes fuerte los 3 días antes de las físicas."]}
 else if(f.n===0&&wd!==0){const sp=sigPaso();foco="Arranque: conocer el examen y saber desde dónde partes";tasks=[X("arr",1,sp.t,15,"ruta","Siguiente paso de tu ruta"),X("q",Math.min(g.q,10),"Responde unas preguntas para calentar",10,"nivel"),X("c",Math.min(g.c,10),"Prueba las tarjetas de memoria",5,"tarjetas"),X("fis",1,"Prueba física: mide tu 1.500 m o tu salto",30,"fis",FIS_DIA[wd])];no=["No empieces a estudiar a lo loco: primero completa el arranque.","No te agobies con todo el temario: vamos tema a tema."]}
 else switch(wd){
  case 1:case 4:foco=(wd===1?"Tema nuevo: ":"Sigue avanzando: ")+(t?"Tema "+t.id:"repaso");tasks=[X("tema",1,"Lee el resumen de "+tt,Math.round(g.min*.4),"tema",t?t.t.split(/[.:]/)[0]:""),X("q",g.q,"Haz el test de "+tt+" en modo estudio",Math.round(g.min*.4),"testtema"),X("c",g.c,"Repasa tus tarjetas pendientes",10,"tarjetas"),X("fis",1,"Entrenamiento físico",40,"fis",FIS_DIA[wd])];no=["No hagas simulacros hoy.","No pases a otro tema sin hacer el test de este."];break;
  case 2:foco="Afianza "+tt;tasks=[X("q",g.q,"Repite el test de "+tt,15,"testtema","Objetivo: 70% o más"),X("psico",1,"Haz un bloque de psicotécnicos",5,"psico"),X("c",g.c,"Repasa tus tarjetas",10,"tarjetas"),X("fis",1,"Entrenamiento físico",40,"fis",FIS_DIA[2])];no=["No releas el tema entero: se aprende más haciendo tests.","No mires el móvil durante el estudio: usa el modo concentración."];break;
  case 3:foco="Día de repaso: tus errores";tasks=[X("fal",Math.min(15,g.q),"Repasa tus preguntas falladas",15,"falladas"),X("c",g.c,"Repasa tus tarjetas",10,"tarjetas"),f.n>=3?X("caso",1,"Escribe un supuesto práctico",30,"supuestos","Y pide al profe que te lo corrija"):X("psico",1,"Haz un bloque de psicotécnicos",5,"psico"),X("fis",1,"Descanso activo",30,"fis",FIS_DIA[3])];no=["Hoy no empieces temas nuevos.","Hoy no entrenes fuerte."];break;
  case 5:foco="Control de la semana";tasks=[X("q",Math.max(g.q,20),"Test de la semana en modo examen",25,"semana","Temas que has trabajado"),X("psico",1,"Haz un bloque de psicotécnicos",5,"psico"),X("c",g.c,"Repasa tus tarjetas",10,"tarjetas"),X("fis",1,"Entrenamiento físico",40,"fis",FIS_DIA[5])];no=["No dejes los fallos del test sin revisar."];break;
  case 6:{const big=f.n>=6,mid=f.n>=2;foco=big?"Simulacro completo":"Simulacro y repaso";tasks=[X("sim",1,big?"Simulacro de 100 preguntas (2 h)":mid?"Medio simulacro (50 preguntas, 1 h)":"Test de repaso de 30 preguntas",big?120:mid?60:25,big?"sim100":mid?"sim50":"rep30"),f.n>=3?X("caso",1,"Escribe un supuesto práctico",30,"supuestos"):X("c",g.c,"Repasa tus tarjetas",10,"tarjetas"),X("fis",1,"Entrenamiento físico",40,"fis",FIS_DIA[6])];no=["Hoy no estudies teoría nueva."];break}
  default:foco="Descanso y planificación";tasks=[X("c",Math.min(g.c,10),"Solo 10 minutos de tarjetas",10,"tarjetas"),X("profe",1,"Lee el informe de tu profe y mira tu ruta",5,"profe")];no=["Descansa: nada de temas nuevos ni simulacros.","No entrenes: el cuerpo también recupera."];}
 tasks=tasks.filter(x=>x.k!=="fis");if(S.goal==="suave")tasks=tasks.slice(0,3);
 const ses=sesionHoy();if(ses&&ses.fam!=="activo")tasks.push(X("fis",1,ses.t,ses.min,"entreno",ses.b.filter(x=>!/^Calentamiento|^Vuelta|^Objetivo/.test(x)).slice(0,2).join(" ")));
 return{wd,foco,tasks,no,f,t,final}}
function taskDone(x){return(dayState()[x.k]||0)>=x.n}
function checkPlan(){const d=dayState();if(d.done)return;const p=dayPlan();if(p.tasks.length&&p.tasks.every(taskDone)){d.done=true;addXP(60);celebrate("¡Plan de hoy completado!","+60 XP. Mañana te espera el siguiente paso.")}}
function nextTask(){return dayPlan().tasks.find(x=>!taskDone(x))}
function nextBanner(){const n=nextTask();if(!n)return `<div class="nextb done"><b>Plan de hoy completado.</b> <span class="small">Puedes seguir practicando o descansar.</span></div>`;return `<div class="nextb"><span class="small">Siguiente paso de hoy</span><b>${esc(n.t)}</b><button class="btn pri" data-task="${n.act}">Ir</button></div>`}
function runTask(act,id){const g=GOALS[S.goal]||GOALS.normal;const t=id?TEMA(id):temaActual();
 switch(act){
  case "tema":if(!t)return go("temario");openTema=t.id;if(!S.temas[t.id])S.temas[t.id]=1;bump("tema");addXP(5);go("temario");break;
  case "testtema":if(!t)return runTask("falladas");startTest(shuffle(QS.filter(q=>q.t===t.id)).slice(0,Math.max(g.q,10)),{mode:"estudio",label:"Test tema "+t.id});break;
  case "tarjetas":cardT=0;cur=null;go("tarjetas");break;
  case "fis":go("fisicas");break;
  case "psico":startPsico("mix");break;
  case "falladas":{const w=QS.filter(q=>S.qs[q.id]&&S.qs[q.id].last===0);if(w.length)startTest(shuffle(w).slice(0,30),{mode:"estudio",label:"Repaso de falladas"});else{toast("No tienes falladas: te pongo preguntas nuevas");startTest(shuffle(QS.filter(q=>!S.qs[q.id]&&q.t<=28)).slice(0,15),{mode:"estudio",label:"Preguntas nuevas"})}break}
  case "semana":{const ids=OFICIALES.filter(x=>(S.temas[x.id]||0)>=1).map(x=>x.id);startTest(shuffle(poolFor(ids)).slice(0,Math.max(20,g.q)),{mode:"examen",label:"Test de la semana",pen:"0.3333"});break}
  case "sim50":{const ct=convSel().test||{};startTest(shuffle(poolFor([])).slice(0,50),{mode:"examen",label:"Simulacro 50",sim:true,limit:Math.round((ct.min||120)/2)*60,pen:ct.pen||"0.3333"});break}
  case "sim100":{const ct=convSel().test||{n:100,min:120,pen:"0.3333"};startTest(shuffle(poolFor([])).slice(0,ct.n||100),{mode:"examen",label:"Simulacro "+(ct.n||100),sim:true,limit:(ct.min||120)*60,pen:ct.pen||"0.3333"});break}
  case "rep30":{const ids=OFICIALES.filter(x=>(S.temas[x.id]||0)>=1).map(x=>x.id);startTest(shuffle(poolFor(ids)).slice(0,30),{mode:"estudio",label:"Repaso semanal",count:"sim"});break}
  case "nivel":startTest(shuffle(poolFor([])).slice(0,20),{mode:"estudio",label:"Test de nivel"});break;
  case "supuestos":go("supuestos");break;
  case "entreno":go("entreno");break;
  case "profe":go("profe");break;
  case "ruta":bump("arr");go("ruta");break;
  case "convocatoria":go("convocatoria");break;
  case "hoy":go("hoy");break;
  default:go(act)}}

/* ================= HOY ================= */
function daysLeft(){if(!S.exam)return null;return Math.ceil((new Date(S.exam+"T09:00:00")-Date.now())/DAY)}
function pdd(){const pool=QS.filter(q=>q.t<=28);return pool[dayNum()%pool.length]}
function vHoy(){
 const p=dayPlan(),d=dayState(),l=level(),st=streak(),dl=daysLeft(),R=readiness();
 const done=p.tasks.filter(taskDone).length,mins=p.tasks.filter(x=>!taskDone(x)).reduce((a,x)=>a+x.min,0);
 const sp=sigPaso();const q=pdd();const ans=S.pdd===today()?S.pddAns:null;
 const lo=xpFor(l),hi=xpFor(l+1);
 const nov=(NOV.items||[]).slice().sort((a,b)=>b.fecha.localeCompare(a.fecha))[0];
 const lastProfe=(PROFE.items||[]).slice().sort((a,b)=>(b.fecha||"").localeCompare(a.fecha||""))[0];
 const tip=CONSEJOS[Math.floor(seeded(dayNum())()*CONSEJOS.length)];
 const wdOrder=[1,2,3,4,5,6,0];const WEEK={1:"Tema nuevo",2:"Afianzar",3:"Repasar errores",4:"Tema nuevo",5:"Test semanal",6:"Simulacro",0:"Descanso"};
 return `
 ${!S.onb?`<section class="panel stack onb"><div class="eyebrow">Bienvenida</div><h2>Antes de empezar: 3 decisiones rápidas</h2>
  <p class="muted">La app te dirá cada día qué toca. Tú solo tienes que abrirla y seguir los pasos.</p>
  <div class="stack"><b>1. ¿Cuánto tiempo puedes dedicar al día?</b><div class="seg wrapseg">${Object.entries(GOALS).map(([k,g])=>`<button data-goal="${k}" aria-pressed="${S.goal===k}">${g.n} · ${g.d}</button>`).join("")}</div></div>
  <label class="f">2. ¿Por qué quieres ser policía? Te lo recordaré cuando te cueste.<input type="text" id="onbMot" value="${esc(S.motivo)}" placeholder="Ej.: Quiero un trabajo estable sirviendo a mi pueblo"></label>
  <label class="f">3. ¿Qué premio te darás al llegar al nivel 5?<input type="text" id="onbPre" value="${esc(S.premio)}" placeholder="Ej.: Unas zapatillas nuevas"></label>
  <div class="row"><button class="btn gold" data-act="onbok">Listo, ver mi plan de hoy</button></div></section>`:""}
 ${convCard()}
 <section class="today">
  <div class="today-h">
   <div><div class="eyebrow inv">${DIAS[p.wd]} ${new Date().toLocaleDateString("es-ES",{day:"numeric",month:"long"})} · Fase ${p.f.n}: ${esc(p.f.t)}</div>
   <h1>${d.done?"Hoy ya has cumplido. ¡Bien hecho!":esc(p.foco)}</h1>
   <div class="row small"><span class="pill gold">${st} ${st===1?"día":"días"} de racha</span><span class="pill inv">${done}/${p.tasks.length} hecho</span>${mins&&!d.done?`<span class="pill inv">≈ ${mins} min</span>`:""}${dl!=null&&dl>0?`<span class="pill inv">${dl} días al examen${S.exampleDate?"*":""}</span>`:""}</div></div>
   ${nextTask()?`<button class="btn gold big" data-task="${nextTask().act}">${done?"Seguir":"Empezar"} →</button>`:""}
  </div>
  <ol class="steps">${p.tasks.map((x,i)=>{const ok=taskDone(x),v=Math.min(dayState()[x.k]||0,x.n);return `<li class="step ${ok?"done":""}"><span class="sn">${ok?"✓":i+1}</span><div class="st"><b>${esc(x.t)}</b>${x.sub?`<span class="small muted">${esc(x.sub)}</span>`:""}<span class="small muted">${x.n>1?`${v}/${x.n} · `:""}≈ ${x.min} min</span></div><div class="row" style="gap:6px">${x.k==="fis"&&!ok?`<button class="btn sm" data-act="fisdone">Hecho</button>`:""}<button class="btn sm ${ok?"":"pri"}" data-task="${x.act}">${ok?"Repetir":"Ir"}</button></div></li>`}).join("")}</ol>
  <div class="nots"><b>Hoy NO:</b>${p.no.map(n=>`<span>✕ ${esc(n)}</span>`).join("")}</div>
 </section>
 ${S.motivo?`<p class="note small"><b>Tu motivo:</b> ${esc(S.motivo)}</p>`:""}
 <section class="grid2">
  <div class="panel stack"><div class="row" style="justify-content:space-between"><div class="eyebrow">Tu ruta</div><button class="btn sm" data-go="ruta">Ver la ruta completa</button></div>
   <h3>Fase ${p.f.n} de 7 · ${esc(p.f.t)}</h3><p class="small muted">${esc(p.f.obj)}</p>
   <div class="bar g"><i style="width:${rutaPct()}%"></i></div><p class="small">Siguiente paso: <b>${esc(sp.t)}</b></p></div>
  <div class="panel stack"><div class="eyebrow">Tu semana</div><div class="week">${wdOrder.map(w=>`<div class="wd ${w===p.wd?"cur":""}"><b>${DIAS[w].slice(0,3)}</b><span>${WEEK[w]}</span></div>`).join("")}</div>
   <p class="small muted">Cada día de la semana tiene su tarea. Si un día no puedes, no pasa nada: al día siguiente sigue lo que toque.</p></div>
 </section>
 <section class="grid2">
  <div class="panel stack"><div class="row" style="justify-content:space-between"><div class="eyebrow">Pregunta del día</div><span class="pill acc">Tema ${q.t}</span></div><p class="q">${esc(q.q)}</p>
   <div class="opts">${q.o.map((o,i)=>{let c="";if(ans!=null){if(i===q.a)c="good";else if(i===ans)c="bad"}return `<button class="opt ${c}" data-pdd="${i}" ${ans!=null?"disabled":""}><span class="l">${LETTERS[i]}</span><span>${esc(o)}</span></button>`}).join("")}</div>
   ${ans!=null?`<div class="expl">${ans===q.a?"<b style='color:var(--ok)'>Correcta. +20 XP</b>":"<b style='color:var(--ko)'>Incorrecta.</b>"} <span class="muted">${esc(q.e)}</span></div>`:""}</div>
  <div class="panel stack"><div class="eyebrow">Nivel ${l} · ${esc(rank(l))}</div><div class="row" style="align-items:center;gap:18px">${ring(R.v)}<div class="stack" style="flex:1;min-width:160px;gap:6px"><b>Preparación estimada</b><span class="small muted">${S.xp} XP · faltan ${hi-S.xp} para ${esc(rank(l+1))}</span><div class="bar"><i style="width:${Math.min(100,(S.xp-lo)/(hi-lo)*100)}%"></i></div><button class="btn sm" data-go="logros">Ver mis logros</button></div></div></div>
 </section>
 <section class="grid2">
  <div class="panel stack"><div class="row" style="justify-content:space-between"><div class="eyebrow">Tu profe</div><button class="btn sm" data-go="profe">Abrir</button></div><button class="btn gold" data-act="analizar">Analiza mis resultados</button>
   ${lastProfe?`<b>${esc(lastProfe.titulo||"")}</b><p class="small">${esc((lastProfe.texto||"").replace(/\*\*/g,"").slice(0,220))}…</p>`:`<p class="small muted">Aquí verás mis informes de cada lunes y jueves.</p>`}
   ${nov?`<p class="small"><span class="pill acc">${esc(nov.tipo)}</span> ${esc(nov.titulo)}</p>`:""}</div>
  <div class="panel stack"><div class="eyebrow">Modo concentración</div>${vFoco()}<p class="small muted">Consejo: ${esc(tip)}</p></div>
 </section>`}
function rutaPct(){let tot=0,ok=0;FASES.forEach(f=>{faseTemas(f).forEach(id=>{tot+=3;const tp=temaPaso(id);ok+=(tp.leido?1:0)+(tp.test?1:0)+(tp.dom?1:0)});f.pasos.forEach(p=>{tot++;try{if(p[1]())ok++}catch(e){}})});return Math.round(ok/tot*100)}
function ring(v){const r=42,c=2*Math.PI*r;return `<svg width="110" height="110" viewBox="0 0 110 110" role="img" aria-label="Preparación ${v}%"><circle cx="55" cy="55" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="12"/><circle cx="55" cy="55" r="${r}" fill="none" stroke="${v>=70?"var(--ok)":v>=40?"var(--gold)":"var(--accent)"}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 55 55)"/><text x="55" y="62" text-anchor="middle" font-family="Barlow Condensed,Arial Narrow,sans-serif" font-weight="700" font-size="26" fill="var(--fg)">${v}%</text></svg>`}
after.hoy=()=>{const m=$("#onbMot");if(m)m.oninput=e=>{S.motivo=e.target.value;save()};const p=$("#onbPre");if(p)p.oninput=e=>{S.premio=e.target.value;save()};paintFoco()};

 return `<section class="panel stack"><div class="eyebrow">Tu ruta hasta la plaza</div><h2>8 fases, paso a paso</h2>

function spark(vals,meta){const w=300,h=60,p=6;const all=vals.concat([meta]);const mn=Math.min(...all),mx=Math.max(...all),rg=mx-mn||1;const X=i=>p+i*(w-2*p)/(vals.length-1),Y=v=>h-p-(v-mn)/rg*(h-2*p);

 for(let w=0;w<W;w++){const a=new Date(start.getTime()+w*7*DAY),b=new Date(a.getTime()+6*DAY);let fase,task;
  if(w<ph1){const ts=OFICIALES.slice(w*per,w*per+per);fase="1 · Primera vuelta";task=ts.length?"Estudiar "+ts.map(t=>"T"+t.id).join(", ")+" · test de cada tema · tarjetas a diario · 1 bloque de psicotécnicos.":"Repaso de temas flojos"+(weak.length?" ("+weak.join(", ")+")":"")+"."}
  else if(w<ph1+ph2){fase="2 · Segunda vuelta";const k=w-ph1;const ts=OFICIALES.filter((t,i)=>i%ph2===k%ph2);task="Repaso de "+ts.map(t=>"T"+t.id).join(", ")+" · test de 30 preguntas · 2 supuestos corregidos por el profe · falladas.";}

  rows.push({w:w+1,a,b,fase,task,fis})}

const PINKEY="pla-pin";let LOCKED=false,pinFails=0,pinWait=0,hiddenAt=0;
function pinGet(){try{return JSON.parse(localStorage.getItem(PINKEY)||"null")}catch(e){return null}}
async function pinHash(pin,salt){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pin));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
function pinUnlocked(){try{return sessionStorage.getItem("pla-unl")==="1"}catch(e){return false}}
function pinInit(){LOCKED=!!pinGet()&&!pinUnlocked()}
document.addEventListener("visibilitychange",()=>{if(document.hidden)hiddenAt=Date.now();else if(pinGet()&&hiddenAt&&Date.now()-hiddenAt>180000){try{sessionStorage.removeItem("pla-unl")}catch(e){}LOCKED=true;render()}});
function vLock(){const wait=Math.max(0,Math.ceil((pinWait-Date.now())/1000));return `<section class="lock panel"><div class="chk" aria-hidden="true"></div><div class="badge" aria-hidden="true">PL</div><h2>App protegida</h2><p class="muted">Escribe tu PIN para entrar.</p>
 <input type="password" id="pinIn" inputmode="numeric" autocomplete="current-password" maxlength="8" placeholder="PIN" aria-label="PIN" ${wait?"disabled":""}>
 <button class="btn pri big" data-act="pinenter" ${wait?"disabled":""}>Entrar</button><p class="small" id="pinMsg">${wait?`Demasiados intentos. Espera ${wait} s.`:pinFails?"PIN incorrecto.":""}</p>
 <details class="case"><summary><span class="small">¿Has olvidado el PIN?</span></summary><div class="in"><p class="small">Sin el PIN no se puede entrar. La única forma de seguir es <b>borrar la app de este dispositivo</b>, con todo su progreso, y empezar de cero (o importar una copia que tengas guardada).</p><div id="wipeBox"><button class="btn sm" style="border-color:var(--ko);color:var(--ko)" data-act="pinwipe">Borrar todo en este dispositivo</button></div></div></details></section>`}

async function pinEnter(){const p=pinGet(),i=$("#pinIn");if(!p||!i)return;if(Date.now()<pinWait)return;const h=await pinHash(i.value,p.salt);
 if(h===p.hash){LOCKED=false;pinFails=0;try{sessionStorage.setItem("pla-unl","1")}catch(e){}document.body.classList.remove("locked");render()}
 else{pinFails++;if(pinFails>=5){pinWait=Date.now()+30000*Math.pow(2,Math.min(pinFails-5,4));setTimeout(render,1000)}render()}}

 if(!/^\d{4,8}$/.test(a)){toast("El PIN debe tener entre 4 y 8 números");return}if(a!==b){toast("Los dos PIN no coinciden");return}
 const salt=Array.from(crypto.getRandomValues(new Uint8Array(12))).map(x=>x.toString(16).padStart(2,"0")).join("");
 try{localStorage.setItem(PINKEY,JSON.stringify({salt,hash:await pinHash(a,salt)}));sessionStorage.setItem("pla-unl","1")}catch(e){toast("No se ha podido guardar el PIN en este navegador");return}
 toast("PIN guardado. La app lo pedirá al abrirla");render()}
async function pinOff(){const cur=pinGet();if(!cur)return;const old=($("#pin0")||{}).value||"";if(await pinHash(old,cur.salt)!==cur.hash){toast("El PIN actual no es correcto");return}try{localStorage.removeItem(PINKEY)}catch(e){}toast("PIN quitado");render()}
function pinPanel(){const has=!!pinGet();return `<section class="panel stack"><div class="eyebrow">Seguridad</div><h3>${has?"Tu app está protegida con PIN":"Protege la app con un PIN"}</h3>
 <p class="small muted">${has?"Se pide al abrir la app y si la dejas en segundo plano más de 3 minutos.":"Así, aunque alguien coja tu móvil, no podrá entrar ni cambiar tu progreso."} El PIN se guarda cifrado solo en este dispositivo.${STANDALONE?"":" En cada dispositivo donde abras la app puedes poner el suyo."}</p>
 <div class="row">${has?`<label class="f">PIN actual<input type="password" id="pin0" inputmode="numeric" maxlength="8" autocomplete="current-password"></label>`:""}<label class="f">${has?"Nuevo PIN":"PIN (4-8 números)"}<input type="password" id="pin1" inputmode="numeric" maxlength="8" autocomplete="new-password"></label><label class="f">Repítelo<input type="password" id="pin2" inputmode="numeric" maxlength="8" autocomplete="new-password"></label></div>
 <div class="row"><button class="btn pri" data-act="pinset">${has?"Cambiar PIN":"Activar PIN"}</button>${has?`<button class="btn" data-act="pinoff">Quitar PIN</button><button class="btn" data-act="pinlock">Bloquear ahora</button>`:""}</div></section>`}

/* ================= ACCIONES ================= */
document.addEventListener("click",e=>{const t=e.target;if(LOCKED&&!t.closest('[data-act^="pin"]')&&!t.closest("summary"))return;const g=t.closest("[data-go]");if(g){go(g.dataset.go);return}
 const o=t.closest("[data-opt]");if(o&&T&&!T.done){const v=+o.dataset.opt;if(T.mode==="estudio"){if(T.ans[T.i]==null){T.ans[T.i]=v;T.counted[T.i]=1;recordAnswer(T.items[T.i].q,v===T.items[T.i].q.a)}}else T.ans[T.i]=v;render();return}
 const pd=t.closest("[data-pdd]");if(pd&&S.pdd!==today()){const v=+pd.dataset.pdd,q=pdd();S.pdd=today();S.pddAns=v;recordAnswer(q,v===q.a);if(v===q.a)addXP(10);bump("pdd");render();return}
 const j=t.closest("[data-jump]");if(j&&T){T.i=+j.dataset.jump;render();return}
 const c=t.closest("[data-cfg]");if(c){const k=c.dataset.cfg;cfg[k]=k==="n"?+c.dataset.val:c.dataset.val;render();return}
 const ts=t.closest("[data-tsel]");if(ts){const id=+ts.dataset.tsel;cfg.temas=cfg.temas.includes(id)?cfg.temas.filter(x=>x!==id):cfg.temas.concat(id);render();return}
 const p=t.closest("[data-pen]");if(p){S.pen=p.dataset.pen;save();render();return}
 const gr=t.closest("[data-grade]");if(gr){grade(+gr.dataset.grade);return}
 const lc=t.closest("[data-loc]");if(lc){locSel=lc.dataset.loc;S.loc=locSel;save();render();return}
 const so=t.closest("[data-sol]");if(so){const i=so.dataset.sol;S.casos[i]=S.casos[i]||{};S.casos[i].sol=!S.casos[i].sol;S.casos[i].open=true;save();render();return}
 const co=t.closest("[data-corr]");if(co){corregir(+co.dataset.corr);return}
 const wy=t.closest("[data-why]");if(wy){why(+wy.dataset.why);return}
 const af=t.closest("[data-addfis]");if(af){const id=af.dataset.addfis,f=FIS_ACT().find(x=>x.id===id);const v=parseVal(f,$("#v_"+id).value);if(isNaN(v)){toast("Escribe una marca numérica");return}S.fis.push({p:id,v,d:today()});bump("fis");addXP(15);render();toast(fisOk(f)?"¡Marca de apto!":"Marca guardada");return}
 const sx=t.closest("[data-sexo]");if(sx){S.sexo=sx.dataset.sexo;save();render();return}
 const gl=t.closest("[data-goal]");if(gl){S.goal=gl.dataset.goal;save();render();return}
 const cv=t.closest("[data-conv]");if(cv){selectConv(cv.dataset.conv);render();return}
 const tk=t.closest("[data-task]");if(tk){e.preventDefault();runTask(tk.dataset.task,+tk.dataset.id||0);return}
 const fc=t.closest("[data-foco]");if(fc){FOCO={min:+fc.dataset.foco,end:Date.now()+fc.dataset.foco*60000};render();return}
 const ps=t.closest("[data-psico]");if(ps){startPsico(ps.dataset.psico);return}
 const pa=t.closest("[data-pans]");if(pa&&P&&!P.done){P.ans[P.i]=+pa.dataset.pans;if(P.i<9){P.i++;render()}else psicoEnd();return}
 const ev=t.closest("[data-entv]");if(ev){valorarEnt(+ev.dataset.entv);return}
 const ak=t.closest("[data-ask]");if(ak){chatSend(ak.dataset.ask);return}
 const b=t.closest("[data-act]");if(!b)return;const act=b.dataset.act,id=+b.dataset.id;
 switch(act){
  case "opentema":openTema=id;if(!S.temas[id])S.temas[id]=1;bump("tema");addXP(5);go("temario");break;
  case "closetema":openTema=null;render();break;
  case "status":{const prev=S.temas[id]||0,nv=+b.dataset.s;S.temas[id]=nv;if(nv>=3){S.domDates=S.domDates||{};S.domDates[id]=today()}if(nv>prev)addXP(25*(nv-prev));else save();render();break}
  case "speak":speak(TEMA(id));break;
  case "explica":explica(TEMA(id));break;
  case "genq":genq(TEMA(id));break;
  case "testia":startTest(shuffle(QS.filter(q=>q.t===id&&q.src==="ia")).slice(0,10),{mode:"estudio",label:"Preguntas del profe"});break;
  case "testtema":startTest(shuffle(QS.filter(q=>q.t===id)),{mode:"estudio",label:"Test tema "+id});break;
  case "cardstema":cardT=id;cur=null;go("tarjetas");break;
  case "expres":startTest(shuffle(poolFor([])).slice(0,7),{mode:"estudio",label:"Sesión exprés"});break;
  case "onbgo":S.onb=true;save();startTest(shuffle(poolFor([])).slice(0,7),{mode:"estudio",label:"Sesión exprés"});break;
  case "onbskip":S.onb=true;save();render();break;
  case "pinenter":pinEnter();break;
  case "pinset":pinSet();break;
  case "pinoff":pinOff();break;
  case "pinlock":try{sessionStorage.removeItem("pla-unl")}catch(e){}LOCKED=true;render();break;
  case "pinwipe":{const w=$("#wipeBox");if(w)w.innerHTML=`<p class="small"><b>¿Seguro?</b> Se borrará todo el progreso de este dispositivo y no se puede deshacer.</p><button class="btn sm" style="border-color:var(--ko);color:var(--ko)" data-act="pinwipe2">Sí, borrar todo</button>`;break}
  case "pinwipe2":try{localStorage.removeItem(PINKEY);localStorage.removeItem(KEY);sessionStorage.removeItem("pla-unl")}catch(e){}location.reload();break;
  case "copylink":{const u="https://claude.ai/artifact/PKwdDy4Apdy37U8ciePFm9";const m=$("#linkMsg");try{navigator.clipboard.writeText(u).then(()=>{if(m)m.textContent="Enlace copiado"},()=>{if(m)m.textContent=u})}catch(e){if(m)m.textContent=u}break}
  case "gnext":gStep++;render();window.scrollTo(0,0);break;
  case "gprev":gStep=Math.max(0,gStep-1);render();window.scrollTo(0,0);break;
  case "gskip":case "gend":S.guia=true;S.onb=true;gStep=0;save();go("hoy");break;
  case "onbok":S.onb=true;save();render();window.scrollTo(0,0);break;
  case "fisdone":entInicio().hechas[today()]=(sesionHoy()||{}).fam||"libre";bump("fis");addXP(15);render();toast("Entrenamiento registrado");break;
  case "simulacro":{const n=+b.dataset.n;startTest(shuffle(poolFor([])).slice(0,n),{mode:"examen",label:"Simulacro "+n,sim:true,limit:n*72,pen:"0.3333"});break}
  case "wrong":startTest(shuffle(QS.filter(q=>S.qs[q.id]&&S.qs[q.id].last===0)).slice(0,40),{mode:"estudio",label:"Repaso de falladas"});break;
  case "unseen":startTest(shuffle(QS.filter(q=>!S.qs[q.id])).slice(0,20),{mode:"estudio",label:"Preguntas nuevas"});break;
  case "custom":{const pool=shuffle(poolFor(cfg.temas));const qs=cfg.n?pool.slice(0,cfg.n):pool;startTest(qs,{mode:cfg.mode,label:cfg.temas.length?"Test temas "+cfg.temas.slice().sort((a,b)=>a-b).join(", "):"Test a medida",limit:cfg.time==="si"?Math.round(qs.length*72):0});break}
  case "next":if(T.i<T.items.length-1)T.i++;render();break;
  case "prev":if(T.i>0)T.i--;render();break;
  case "blank":T.ans[T.i]=null;render();break;
  case "finish":finish();break;
  case "abort":clearInterval(timerId);T=null;render();break;
  case "newtest":T=null;render();break;
  case "retrywrong":{const qs=T.items.filter((it,k)=>T.ans[k]!==it.q.a).map(it=>it.q);startTest(shuffle(qs),{mode:"estudio",label:"Repetir falladas"});break}
  case "analiza":analiza();break;
  case "flip":flipped=true;render();break;
  case "cardsall":{const pool=CARDS.filter(c=>!cardT||c.t===cardT);cur=shuffle(pool)[0];flipped=false;render();break}
  case "focostop":FOCO=null;clearInterval(focoTimer);render();break;
  case "psend":psicoEnd();break;
  case "psback":P=null;render();break;
  case "chatsend":{const i=$("#chatIn");if(i)chatSend(i.value);break}
  case "chatstop":try{chatCtl&&chatCtl.abort()}catch(e){}break;
  case "chatclear":S.chat=[];save();render();break;
  case "analizar":if(view!=="profe"){go("profe");setTimeout(analizarTodo,50)}else analizarTodo();break;
  case "anstop":try{anCtl&&anCtl.abort()}catch(e){}break;
  case "pedirrev":pedirRevision();break;
  case "export":{const txt=JSON.stringify(S);$("#bk").innerHTML=`<textarea id="bkt" readonly>${esc(txt)}</textarea>`;const ta=$("#bkt");try{navigator.clipboard.writeText(txt).then(()=>toast("Progreso copiado"),()=>{ta.select();toast("Selecciona y copia el texto")})}catch(err){ta.select()}break}
  case "showimport":$("#bk").innerHTML=`<textarea id="bki" placeholder="Pega aquí tu copia"></textarea><div class="row"><button class="btn pri" data-act="doimport">Importar</button></div>`;break;
  case "doimport":try{const ob=JSON.parse($("#bki").value);if(!ob||typeof ob!=="object")throw 0;Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,def(),ob);buildQS();save();render();toast("Progreso importado")}catch(err){toast("La copia no es válida")}break;
  case "reset":$("#bk").innerHTML=`<div class="note small">Se borrará todo tu progreso, también el guardado en tu cuenta. <button class="btn sm" style="border-color:var(--ko);color:var(--ko)" data-act="doreset">Sí, borrar todo</button></div>`;break;
  case "doreset":Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,def());S.exam=dstr(new Date(Date.now()+180*DAY));buildQS();save();render();toast("Progreso borrado");break;
 }});

snapBase();if(!S.guia&&!(S.convDates&&Object.keys(S.convDates).length))selectConv(S.conv||"unif2027",true);const h0=location.hash.slice(1);go(!S.guia?"guia":VIEWS.includes(h0)?h0:"hoy");
